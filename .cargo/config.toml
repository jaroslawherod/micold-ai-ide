# Cap how much of the machine a build or test run may take.
#
# `jobs` limits the parallel compilation units cargo schedules (applies to
# `cargo build`, `cargo test`, `cargo run`, ...); `RUST_TEST_THREADS` limits the
# threads libtest uses to *execute* tests. Both are overridable ad hoc:
# `cargo build -j 8`, or `RUST_TEST_THREADS=8 cargo test` (env vars set in the
# shell win over the `[env]` table unless `force = true`).
[build]
jobs = 4

# One target directory per checkout. A relative path here resolves against *this config file's*
# directory, and the file is checked in, so a worktree resolves it to a target-shared/ beside the
# worktree -- NOT the main checkout's. Only scripts/build-lock.sh (every `mise run` task) exports
# CARGO_TARGET_DIR to the one shared directory and takes the repo-wide build lock; a bare `cargo`
# in a worktree builds into a private copy and bypasses the lock. The PreToolUse hook
# scripts/bare-cargo-hook.sh refuses that for agents; humans: use `mise run`.
# See docs/development/shared-build.md.
target-dir = "target-shared"

[env]
RUST_TEST_THREADS = "4"

# Cap the linker's thread pool as well. rust-lld is the default linker on this
# target and sizes its pool from the CPU count (17 threads on a 16-thread host),
# so `jobs = 4` alone still allows ~68 linker threads against a single NVMe
# queue. Note this trims I/O fan-out and thread churn rather than memory: about
# 79% of rust-lld's ~1.7 GB RSS is mmap'd input objects, which is reclaimable
# page cache, not anonymous memory.
#
# The flag is scoped to this triple because `--threads` is an lld option; a
# build that swaps in GNU ld would reject it.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--threads=4"]

# rustc passes `-Wl,-O1` to every GNU-style linker, and `zig cc` (cargo-zigbuild, `mise run
# remote-daemons`) answers "ignoring deprecated linker optimization setting '1'". zig warns on any
# `-O` value, so the message cannot be argued away: allow the lint for the zig-linked musl targets.
[target.x86_64-unknown-linux-musl]
rustflags = ["-A", "linker-messages"]
[target.aarch64-unknown-linux-musl]
rustflags = ["-A", "linker-messages"]
