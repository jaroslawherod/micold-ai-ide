# Weekly dependency updates, grouped so a week's bumps land as a few CI runs rather than one per package.
version: 2
updates:
  # Every action is pinned to a full commit SHA with the version in a trailing comment; Dependabot bumps
  # both together, so a pin never drifts from the version it names.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # The Rust workspace: one manifest and one Cargo.lock at the root cover all three crates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # `deps` is release-please's "Dependencies" changelog section; these bumps change what ships.
    commit-message:
      prefix: deps
    groups:
      # iced's internal crates are pinned with `=` to the version the facade uses (see Cargo.toml), so
      # the three have to move in one PR or the pins cannot resolve.
      iced:
        patterns:
          - "iced"
          - "iced_*"
      # Everything else that is not a major bump, in one PR. Majors stay one PR each, since they tend to
      # need code changes. Dependabot ranks a version by position, so for a 0.x crate a breaking 0.x → 0.y
      # counts as "minor" and still lands here; if that turns this PR red, peel the crate out with an
      # `ignore` entry and take it by hand.
      cargo:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "iced"
          - "iced_*"

  # The docs site's rendered-page checks (feature 028); `pages.yml` installs them with `npm ci`.
  # Playwright and its axe integration move together, so they share one PR.
  - package-ecosystem: npm
    directory: /site/checks
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      site-checks:
        patterns:
          - "*"

  # The sandbox image's base. Its tag names a Node major on purpose — the current LTS — so a major bump
  # (which would be a non-LTS odd release half the time) is a deliberate change, not a weekly one.
  - package-ecosystem: docker
    directory: /packaging/sandbox
    schedule:
      interval: weekly
    # `deps`, like the crates: the base is part of the image that ships.
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
