# Keeps the workflows' actions current. Every action is pinned to a full commit SHA with the version in
# a trailing comment; Dependabot bumps both together, so a pin never drifts from the version it names.
# Grouped into one weekly PR so an update lands as a single CI run rather than one per action.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
