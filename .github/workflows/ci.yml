name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is feature 023's escape hatch: applying the `full-ci` label must start a *fresh*
    # run, because re-running an existing one replays the original event payload and would never
    # see a label added afterwards. Removing the label is deliberately not a trigger -- the next
    # push reclassifies anyway, and a full run someone asked for costs nothing to keep.
    types: [opened, synchronize, reopened, labeled]

# One live run per pull request. `labeled` fires once per label, so a PR opened with labels already
# attached -- every Dependabot PR -- started a full pipeline per label for the same commit and queued
# the runners behind five copies. A newer run supersedes an older one safely: its payload carries
# every label on the PR at that moment, `full-ci` included. Pushes to main key on the run id, so they
# never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # See the matching note in release.yml. The shared target directory in .cargo/config.toml is a
  # local-machine concession to many concurrent worktrees; on a runner it only breaks
  # Swatinem/rust-cache, which caches ./target and would restore and save nothing.
  CARGO_TARGET_DIR: target

jobs:
  # Which paths did this change touch? (Feature 023.) Every skip below keys off this verdict, and
  # this job is the only one that asks the question -- the decision itself lives in
  # `scripts/classify-change.sh`, which is driven by `scripts/tests/classify-change.test.sh`, so
  # the workflow carries no rule of its own.
  classify:
    name: classify change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.verdict.outputs.docs_only }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the classification is against the merge base, not the last commit
      - name: Classify
        id: verdict
        env:
          # The escape hatch: label a pull request `full-ci` to force the whole pipeline. The
          # `labeled` trigger above exists so that applying it starts a fresh run -- re-running an
          # existing run replays the original event payload and would not see the new label.
          FORCE_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -o pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            # A pull request. `fetch-depth: 0` does NOT create `origin/<base>`, which is why the
            # `assertions` job below fetches explicitly despite using it too. Without this the
            # classifier reports `base ref unavailable`, every run falls back to the full pipeline,
            # and the feature silently never fires.
            git fetch --quiet origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            # A push. `before` is the previous tip; it is all zeroes for a new branch and may no
            # longer exist after a force push. The script treats both as code-affecting.
            BASE="${{ github.event.before }}"
          fi
          scripts/classify-change.sh "$BASE" HEAD 2> "$RUNNER_TEMP/offenders.txt" \
            | tee -a "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/offenders.txt"
      - name: Summarise the verdict
        if: always()
        env:
          DOCS_ONLY: ${{ steps.verdict.outputs.docs_only }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            headline="**Documentation-only change** — lint, build and test are skipped."
          else
            headline="**Code-affecting change** — the full pipeline runs."
          fi
          {
            echo "### classify change"
            echo
            echo "$headline"
            echo
            echo "Reason: \`${REASON:-unavailable}\`"
            if [ -s "$RUNNER_TEMP/offenders.txt" ]; then
              echo
              echo '<details><summary>Paths that made this code-affecting</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/offenders.txt"
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Formatting + lints run once on Linux (they are platform-independent).
  lint:
    name: fmt + clippy
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # FR-040: the render-free core must lint clean on its own (no iced/PTY in scope).
      - name: clippy (render-free core)
        run: cargo clippy -p micold-core --all-targets -- -D warnings
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The shell-side suites: the documentation-set declaration, the change classifier, and the
      # assertion-freeze gate. They gate what CI skips and what it blocks, so they are enforced
      # here rather than only locally.
      # Linux-only by design -- the classifier runs nowhere else (see plan.md's Complexity
      # Tracking).
      - name: Test (shell suites)
        run: |
          for t in scripts/tests/*.test.sh; do
            echo "== $t"
            "$t"
          done

  # Constitution Principle VI: Linux, macOS, and Windows. `fail-fast: false` so one platform's
  # failure still reports the others — the point of the matrix is seeing *which* platforms differ.
  test:
    name: build + test (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install iced system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Drop the vendor apt repositories the runner image preconfigures (Microsoft's
          # `azure-cli` and `prod`, Google Chrome) before updating. Every package installed below
          # comes from the Ubuntu archive; none has ever come from those. But `apt-get update`
          # exits 100 if *any* configured repository fails, so an outage in software this project
          # does not use fails the job -- as one did on 2026-08-27, when packages.microsoft.com
          # answered 403 for both of its repositories and the only consequence was a red build
          # that a re-run cleared.
          #
          # Emptying `sources.list.d` except for `ubuntu.sources` leaves the archive itself alone on
          # both runner generations: jammy keeps it in `/etc/apt/sources.list`, noble in
          # `sources.list.d/ubuntu.sources`. Deleting by exception rather than by `*.list` matters
          # because the vendor repositories are defined as `.list` on one image generation and as
          # deb822 `.sources` on the other. If a future image moved the archive somewhere this does
          # remove, the install below would fail immediately on a missing package rather than
          # silently install the wrong thing.
          sudo find /etc/apt/sources.list.d -mindepth 1 -not -name ubuntu.sources -delete
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      # Principle I: the render-free core compiles and passes with no iced/PTY (FR-040),
      # verified on every platform.
      - name: Test (render-free core, no GUI)
        run: cargo test -p micold-core --all-targets
      # Ensure the full workspace (client GUI binary + daemon) compiles on every platform.
      - name: Build (workspace)
        run: cargo build --workspace
      # Feature 030 (FR-025): the daemon's own suite on Windows -- the singleton, the pipe's DACL, the
      # stop path and the process-tree teardown are all Windows-specific code. Linux already runs it
      # in the full-workspace step below. `!cancelled()` so a red core step above does not hide
      # which daemon behaviours differ on this platform. The timeout bounds a hung test: libtest has
      # none of its own, and a hang otherwise holds the runner until GitHub's six-hour limit.
      - name: Test (daemon, Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 20
        shell: bash
        run: cargo test -p micold-daemon --all-targets
      # Feature 028 (FR-036): the packaging gate. The bundle is composed from the binaries the
      # step above just produced -- no second checkout, no second compile -- signed ad-hoc, and
      # then actually launched. Composition alone would not catch the failure that matters: the
      # client resolves the daemon as a *sibling of `current_exe()`*, so a bundle that puts the two
      # binaries anywhere but together looks perfectly healthy and can never start a session. The
      # endpoint appearing is that constraint asserting itself.
      #
      # This lives in the `test` job rather than a job of its own so that `ci-complete` (and
      # `ci_gate_covers_every_job.rs`) need no edit; see research R12. `specs/028-macos-package/
      # quickstart.md` §B states what it does, and `micold-core/tests/macos_package_gate.rs` holds
      # the two descriptions together.
      #
      # Carried risk, research R12 contingency (b): whether a GitHub runner can give iced a drawing
      # surface at all. A window-surface failure says nothing about packaging -- the bundle loaded,
      # dyld resolved, the plist parsed -- so it is reported and treated as a pass. Every other way
      # of dying still fails, which keeps the escape hatch narrow: a missing library, a rejected
      # signature and a bundle whose daemon is not beside its client all look nothing like it.
      - name: Package and launch the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          scripts/macos-bundle.sh --bin-dir target/debug --out target/macos

          app="target/macos/micold-ai-ide.app"
          log="$RUNNER_TEMP/launch.log"
          sock="$HOME/.micold/run/d.sock"

          "$app/Contents/MacOS/micold-ai-ide" > "$log" 2>&1 &
          pid=$!

          # Whichever comes first: the endpoint appears, or the process is gone. Twenty seconds is
          # for a cold runner spawning a daemon, not for a hang -- a healthy launch takes one.
          for _ in $(seq 1 20); do
            [ -S "$sock" ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done

          if kill -0 "$pid" 2>/dev/null && [ -S "$sock" ]; then
            echo "Bundle launched; daemon endpoint $sock appeared."
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 0
          fi

          echo "--- launch log ---"
          cat "$log" || true
          echo "------------------"

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          # Research R12 contingency (b). Matched against the log rather than the exit status,
          # because iced reports a surface failure and a missing library through the same code.
          if grep -Eqi "GraphicsCreationFailed|no suitable graphics adapter|surface|wgpu|NoAvailablePixelFormat" "$log"; then
            echo "The runner could not give iced a drawing surface. Treating as a pass: the"
            echo "bundle loaded and the executable ran, which is what this step packages-tests."
            exit 0
          fi

          echo "The bundled application did not start, and not for want of a drawing surface."
          exit 1
      # Feature 030 (FR-018, SC-007): the x64 packaging gate, the Windows counterpart of the step
      # above. The setup .exe is built by the same script the release uses, then installed per user,
      # launched, and checked for the daemon's pipe and for any console window -- the smoke script
      # states each assertion. ARM64 is its own job, `windows-arm64-package`, because the matrix has
      # no ARM64 Windows leg. The setup executables are kept a week for the manual quickstart (M1-M6).
      - name: Package the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/windows-installer.sh --arch x64 --out-dir dist
      # Non-blocking until the Windows endpoint lands (030 T016-T021): the daemon's pipe cannot appear
      # while `resolve()` is a stub, so A3 is red by design. Remove `continue-on-error` in T040.
      - name: Install and launch the Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: scripts/windows-install-smoke.sh dist/micold-ai-ide-*-x64-setup.exe
      - name: Keep the Windows setup executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-setup-x64
          path: dist/*.exe
          retention-days: 7
      # Feature 020's gates, the 017 gates it widened, BUG-001's, feature 021's architecture guards,
      # and feature 027's two client-side §A gates. These read source text, one `const` slice and a
      # reducer — they open no window — so they run wherever the crate compiles, and this step is the authoritative list of them. Path
      # handling (`\` vs `/` in the scanners' display keys) is exactly the kind of difference a
      # Linux-only run would miss: several of these walk the source tree from `CARGO_MANIFEST_DIR`
      # and report findings by path.
      #
      # The feature-021 block was added at T079, and the reason it is here rather than in the
      # Linux-only step below is SC-006: "the complete pre-existing test suite passes on all three
      # supported platforms" is not met by a matrix that builds everywhere and runs a feature's own
      # guards in one place. Verified display-free before being widened — all 20 targets pass with
      # `DISPLAY` and `WAYLAND_DISPLAY` unset — and none constructs an iced runtime or a window.
      #
      # This list is enumerated, so it drifts silently: a §A gate added to the quickstart's table and
      # not added here still runs — on Linux, in the job below — and the three-platform claim quietly
      # stops being true. `micold-core/tests/quickstart_a_runs_everywhere.rs` compares the two.
      - name: Test (component library, showcase, and architecture gates, all platforms)
        # Windows defaults to `pwsh`, which does not treat `\` as a line continuation; pin bash so the
        # one readable multi-line invocation below parses identically on all three runners.
        #
        # Feature 028 adds three (T052 — FR-018): `root_vocabulary_is_cross_cutting`,
        # `root_state_is_shared` and `logical_state_ownership`. They belong here rather than only in
        # the Linux full-workspace run for the same reason the 021 block does — each reports its
        # findings *by path* (`features/sidebar.rs`, `ui/mod.rs`, `state.sidebar.expanded`), and a
        # `\` vs `/` difference in how a path is built goes unnoticed on a Linux-only run and then
        # fails, or worse silently passes, on a contributor's Windows checkout.
        shell: bash
        run: |
          cargo test -p micold-client \
            --test showcase_completeness \
            --test showcase_determinism \
            --test showcase_isolation \
            --test showcase_captions \
            --test showcase_state \
            --test showcase_glue \
            --test packaging_excludes_showcase \
            --test material_boundary \
            --test material_builder_api \
            --test idle_requests_no_frames \
            --test animated_layout_relayouts \
            --test feature_write_isolation \
            --test root_is_routing_only \
            --test root_vocabulary_is_cross_cutting \
            --test root_state_is_shared \
            --test logical_state_ownership \
            --test features_are_render_free \
            --test no_concrete_implementations \
            --test overlay_registration \
            --test feature_registration_cost \
            --test surface_registration_cost \
            --test service_capability_fakes \
            --test outcome_termination \
            --test popover_displacement \
            --test features_connection \
            --test features_help \
            --test features_notifications \
            --test features_project \
            --test features_session \
            --test features_settings \
            --test features_sidebar \
            --test features_window \
            --test features_worktree \
            --test features_worktree_form \
            --test anatomy_call_sites
      # Feature 010's T144 (BUG-008). The daemon's PTY tests are Unix-only and run in the Linux
      # full-workspace step below, so without this step no Windows runner ever started a session:
      # job-object process-tree teardown, the `0x03` interrupt through ConPTY, `portable-pty`'s
      # inverted Windows `kill()` result and the ConPTY teardown order were all built here and
      # exercised nowhere. The target is `#![cfg(windows)]`, so it is conditioned rather than listed
      # in the all-platform step, where it would pass on the other two by compiling to nothing.
      - name: Test (daemon Windows process supervision)
        if: runner.os == 'Windows'
        run: cargo test -p micold-daemon --test windows_process_tree
      # Feature 010's SC-013. Every daemon test that starts a session is Unix-only and ran in the
      # Linux full-workspace step below alone, so the macOS arms of `platform/unix.rs` were compiled
      # here and run nowhere -- among them the `waitid(WNOWAIT)` exit check and the `kill(-pid)`
      # group signal, which differ from Linux in what `getpgid` answers for a zombie.
      - name: Test (daemon)
        if: runner.os == 'macOS'
        # Several of these start a real daemon and wait on it; a test that cannot find the one it
        # started waits forever, and a job's own limit is six hours.
        timeout-minutes: 20
        run: cargo test -p micold-daemon --no-fail-fast
      # Run the client + daemon test suites where the iced system deps are present.
      - name: Test (full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace
      # Feature 021's frame budget (SC-002) is a release-build number, so its measurements are
      # ignored in the debug suite above and run here instead (BUG-003).
      - name: Test (type-ahead frame budget, release)
        if: runner.os == 'Linux'
        run: cargo test --release -p micold-core --test typeahead_budget

  # Feature 030 (FR-015, FR-018): each setup .exe installs only on its own architecture, so ARM64 is
  # packaged and smoke-tested natively, on the runner the release uses for it. The `test` matrix has
  # no ARM64 Windows leg, hence a job of its own; it is gated by `ci-complete` like every other.
  windows-arm64-package:
    name: package + smoke (windows-11-arm)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the setup executable
        run: scripts/windows-installer.sh --arch arm64 --out-dir dist
      # Non-blocking until the Windows endpoint lands (030 T016-T021), as on the x64 leg. Remove
      # `continue-on-error` in T040.
      - name: Install and launch it
        continue-on-error: true
        run: scripts/windows-install-smoke.sh dist/micold-ai-ide-*-arm64-setup.exe
      - name: Keep the setup executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-setup-arm64
          path: dist/*.exe
          retention-days: 7

  # Feature 027. The sandbox adapter layer is tested on all three platforms by the `test` job
  # above, against an injected fake runner with nothing installed -- that is what keeps Principle
  # VI's coverage of it honest. This job covers the part a fake cannot: that the argv we construct
  # is accepted by a real container runtime, and that the isolation it produces is real.
  #
  # Linux-only on purpose. Docker Desktop is not available on GitHub's macOS and Windows runners,
  # so the alternative to a Linux-only job is no real-runtime job at all. The asymmetry is in test
  # *depth*, not in behaviour: nothing in the sandbox layer branches on the host platform except
  # `pathmap`, which the cross-platform job covers directly.
  sandbox-runtime:
    name: sandbox against a real runtime (linux)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Runtime version
        run: docker version --format '{{.Server.Version}}' && docker info --format '{{.Driver}}'
      # Every test behind `sandbox-real-runtime` starts from `micold-daemon:dev`, the image a
      # developer builds with `mise run image`. A runner has no such image, and the failure is not
      # a helpful one: the first test to want it dies on `No such image: micold-daemon:dev` and
      # cargo stops there, so the tests after it never run at all and the summary shows one failure
      # rather than the six targets that were skipped behind it.
      #
      # This is `mise run image` with its two host-specific parts removed. It does not go through
      # `scripts/build-lock.sh` -- the lock exists to stop several worktrees on one workstation from
      # compiling into one target directory, and a runner has neither -- and it does not
      # cross-compile, because `x86_64-unknown-linux-gnu` is already this runner's own triple. What
      # it keeps is the part that matters: the daemon binary staged beside the Containerfile, and
      # `-f`, without which docker looks for a `Dockerfile` and fails.
      - name: Build the :dev sandbox image
        run: |
          set -e
          cargo build --release -p micold-daemon
          cp target/release/micold-daemon packaging/sandbox/micold-daemon
          docker build -f packaging/sandbox/Containerfile -t micold-daemon:dev packaging/sandbox
          rm -f packaging/sandbox/micold-daemon
          # The image can build and still not run: `docker build` only proves the file was copied,
          # and whether it executes depends on the base's glibc being no older than the toolchain's.
          # That mismatch surfaces as `version GLIBC_x.yy not found` on first start, which is a
          # terrible place to find out -- so find out here. The daemon exits for its own reasons
          # (no token, no endpoint) and those are correct; only loader failures are fatal.
          smoke="$(docker run --rm --entrypoint /usr/local/bin/micold-daemon micold-daemon:dev 2>&1 | head -5 || true)"
          case "$smoke" in
            *GLIBC*|*"cannot execute"*|*"exec format error"*)
              echo "the daemon cannot execute inside micold-daemon:dev:" >&2
              echo "$smoke" >&2
              exit 1
              ;;
          esac
      # `sandbox_real_` is a *test-name* filter, not a file filter: cargo matches it against the
      # test function's path, and an integration target's name is not part of that path. So a test
      # in `tests/sandbox_real_*.rs` whose function is not also named `sandbox_real_*` runs locally
      # and is silently skipped here — no failure, just a smaller number in the summary. Every
      # real-runtime test therefore carries the prefix in its own name.
      - name: Test (real runtime, adapter layer)
        run: cargo test -p micold-core --features sandbox-real-runtime sandbox_real_ -- --test-threads=1
      # The other half, and the half that carries the feature's headline claims. `micold-core`'s
      # real-runtime targets cover the adapter -- argv a runtime accepts, the isolation it produces
      # -- while `micold-daemon`'s cover what that isolation is *for*: the boundary probed from
      # inside a session the daemon spawned (US1), terminal parity against a host daemon (US2),
      # limits stopping the session and not the service (US4), the image carrying every AI CLI the
      # application offers (FR-023a), the fingerprint refusal (FR-024d), and sessions surviving a
      # client restart with the survival opt-in bringing the sandbox back unasked (FR-014a/b/c).
      #
      # They ran on no machine at all until now. The step above says `-p micold-core`, so cargo
      # never built this crate's targets, and eleven tests -- including quickstart §B.2, which says
      # in writing that its boxes "re-check themselves on every sandbox-runtime CI run" -- were
      # verified exactly once, by hand, in the T120 pass. A test nothing runs is documentation.
      #
      # `--release` is required rather than preferred. The daemon inside the image is release-built,
      # and `sandbox_real_session_start` compares it against `CARGO_BIN_EXE_micold-daemon`, which is
      # whatever profile this run used: a debug host daemon against a release containerised one
      # flatters the container, which is the wrong direction for "the sandbox is not much slower".
      # The test refuses to report a number when the profiles disagree -- and refusing is a failure,
      # which is why `--no-fail-fast` is here too. Without it cargo stops at that target and every
      # target after it is skipped in silence, `sandbox_real_staleness` included.
      - name: Test (real runtime, daemon)
        run: cargo test --release -p micold-daemon --features sandbox-real-runtime sandbox_real_ --no-fail-fast -- --test-threads=1

  # Constitution Principle VII: documentation ships and is verified in CI.
  # Feature 021 (FR-027): the restructuring treats the existing suite as its behavior
  # specification, which only works while the assertions are frozen.
  #
  # The job runs on every branch, but the rule it enforces does not apply to every branch: FR-027
  # binds changes made *for feature 021*, and every other feature owns its own expectations. The
  # script decides that for itself and reports without failing when out of scope (spec.md Q3).
  #
  # Blocking as of T074, and the thing that made that possible is not a lower false-positive rate
  # -- it is that a false positive can now be answered. FR-027 forbids expectations being relaxed,
  # rewritten or deleted; it cannot forbid an assertion's *spelling* changing when the thing it
  # names changes shape, and spec.md Q3 refuses to let the check guess which is which. So a removal
  # is either reinstated or adjudicated in specs/021-mvu-slice-architecture/assertion-adjudications.md,
  # under a heading naming the task and with the reason, and the check re-verifies every entry
  # against the current tree on every run: an adjudication whose assertion is no longer missing
  # fails just as loudly. Scope still applies -- out of scope this reports in full and exits 0, so
  # a concurrent feature is told what it did to the suite without being blocked.

  assertions:
    name: assertion freeze
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs history to diff against the base ref
      # The gate's own cases, before the gate runs. They existed and nothing ran them, which is how
      # a staleness rule that failed on every branch cut from main reached main: the suite is the
      # only place that mistake is cheap to catch, and it was being asked on no machine at all.
      - name: The check's own cases
        run: scripts/tests/check-assertions-frozen.test.sh
      - name: Assertions frozen since base
        env:
          # A pull request checks out a detached merge commit, so the branch name is not in the
          # repository to be read -- and it is one of the two signals scope is decided from.
          FREEZE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch --quiet origin "${{ github.base_ref || 'main' }}"
          scripts/check-assertions-frozen.sh "$BASE"

  # Deliberately unconditional (feature 023, FR-010): this is the one gate a documentation-only
  # change can actually break, so skipping the build must not skip it. No `needs: classify`, no
  # `if:`.
  docs:
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the user-guide gate below compares against the merge base
      - name: Required user-guide docs exist
        run: |
          test -f docs/user-guide/help-about.md
          test -f docs/user-guide/project-selection.md
          test -f docs/user-guide/appearance-theming.md
          test -f docs/user-guide/settings.md
          test -f docs/user-guide/sandboxed-daemon.md
          test -f docs/user-guide/worktrees-and-sessions.md
          test -f docs/user-guide/icons.md
          test -f docs/user-guide/install-macos.md
          test -f docs/user-guide/install-windows.md
      # Principle VII for a developer-facing capability: feature 020's showcase is documented for
      # developers rather than in the user guide (its FR-024), and the doc ships in the same change.
      - name: Required developer docs exist
        run: |
          test -f docs/development/architecture.md
          test -f docs/development/component-library.md
          test -f docs/development/component-showcase.md
          # Feature 023 is developer-facing, so Principle VII is satisfied here rather than in the
          # user guide. This check runs on documentation-only changes too -- which is the point.
          test -f docs/development/ci-pipeline.md
          # Feature 028: how the macOS artifact is produced, how to reproduce it without any Apple
          # account, and what a Developer ID would change. A packaging process nobody but CI can
          # run is one nobody can fix (FR-033).
          test -f docs/development/macos-packaging.md

      # Constitution Principle VII, the half that was not mechanical. "Every user-facing feature
      # MUST ship with corresponding user-guide documentation in the same change" was enforced by
      # the docs *build* passing and by review noticing -- and review is what skips it when the
      # diff is long and the feature works. The rule lives in `scripts/check-user-guide-updated.sh`
      # and the path declaration in `.gitattributes`, so this workflow carries none of it.
      #
      # In this job rather than one of its own, deliberately: a new job would have to be added to
      # `ci-complete`'s `needs:` AND to the required-check name in the default branch's ruleset,
      # which lives outside this repository. `docs` also already runs unconditionally, which is
      # what a gate about documentation needs.
      #
      # The check's own cases run FIRST, as they do for the criteria gate below -- the
      # assertion-freeze gate shipped with cases that existed and nothing ran, and this ordering is
      # how that stops repeating.
      - name: The user-guide gate's own cases
        run: scripts/tests/check-user-guide-updated.test.sh
      - name: A user-facing feature updates the user guide
        # Pull requests only: this is a pre-merge gate, and the label that waives it lives on a
        # pull request. A push to main has already been through it.
        if: github.event_name == 'pull_request'
        env:
          # Passed as environment rather than interpolated into the script: a title is arbitrary
          # text somebody types, and `${{ }}` inside `run:` would put it in the shell's mouth.
          CHANGE_TITLE: ${{ github.event.pull_request.title }}
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        run: |
          # fetch-depth: 0 does NOT create `origin/<base>` -- the same trap the classify and
          # assertions jobs fetch explicitly to avoid.
          git fetch --quiet origin "${{ github.base_ref }}"
          scripts/check-user-guide-updated.sh "origin/${{ github.base_ref }}" HEAD

      # Feature 010, BUG-008. A success criterion that names no observable cannot be checked by
      # anyone who is not standing at the machine, so it is skipped -- and CI stays green while it
      # is, because nothing can fail a criterion nobody can run. This gate is deliberately in the
      # `docs check` job: the omission is made in a spec file, on documentation-only changes, which
      # is exactly when the rest of the pipeline is skipped.
      #
      # The check's own cases run FIRST, and this ordering is the point rather than tidiness: the
      # assertion-freeze gate beside it shipped with cases that existed and nothing ran, which is
      # this same bug one level down.
      - name: The criteria check's own cases
        run: scripts/tests/check-criteria-observables.test.sh
      - name: Every success criterion names its observable
        run: scripts/check-criteria-observables.sh

      # The pre-merge half of the documentation site's checks (feature 028). They are steps in this
      # job and not a job of their own, deliberately: `docs` is the one job feature 023 keeps running
      # on a documentation-only change, so it is the only place a check over documentation is
      # guaranteed to run at all -- and adding a job would mean adding it to `ci-complete`'s `needs:`
      # and to the required-check name the default branch's ruleset holds, which lives outside this
      # repository.
      #
      # lychee arrives as its published binary rather than through `cargo install`. This job has no
      # Rust toolchain and wants none: installing one and compiling a link checker would cost a
      # documentation-only change several minutes, which is the cost feature 023 exists to remove.
      # `pages.yml` installs it with cargo instead, because it already has the toolchain, the cache
      # and mdBook to install beside it.
      - name: Install lychee
        env:
          LYCHEE_TAG: lychee-v0.24.2
          LYCHEE_ASSET: lychee-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          base="https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_TAG"
          curl -fsSL -O "$base/$LYCHEE_ASSET" -O "$base/$LYCHEE_ASSET.sha256"
          sha256sum -c "$LYCHEE_ASSET.sha256"
          # The binary is inside a directory named after the asset, not at the root of the
          # archive -- `tar xzf "$LYCHEE_ASSET" lychee` finds nothing and fails the job.
          tar xzf "$LYCHEE_ASSET"
          sudo install -m 0755 "${LYCHEE_ASSET%.tar.gz}/lychee" /usr/local/bin/lychee
          rm -rf "$LYCHEE_ASSET" "$LYCHEE_ASSET.sha256" "${LYCHEE_ASSET%.tar.gz}"
          lychee --version
      - name: Every page is listed, and the theme is drawn from the tokens
        run: site/checks/page-set.sh
      - name: The pages, the media manifest and the scenes agree
        run: site/checks/media-references.sh
      - name: Every internal link in the sources resolves
        run: site/checks/links.sh --sources

  # The single status check the default branch's ruleset requires (feature 023). It states the
  # outcome of the run instead of enumerating the pipeline's internals, which is what lets the jobs
  # above be skipped on a documentation-only change without making a pull request unmergeable.
  # Requiring job names welds the merge gate to the pipeline's shape; requiring this one does not.
  #
  # See docs/development/ci-pipeline.md and
  # specs/023-docs-only-ci-skip/contracts/required-checks.md. Renaming this job breaks the merge
  # gate for every pull request, and no pull request can fix it -- the ruleset lives outside the
  # repository.
  ci-complete:
    name: ci complete
    needs: [classify, lint, test, windows-arm64-package, sandbox-runtime, assertions, docs]
    # Load-bearing. Without it the implicit `success()` applies, so this job would be *skipped*
    # whenever a covered job failed -- and a skipped check reports success. The gate would go green
    # exactly when the run went red. `crates/micold-core/tests/ci_gate_covers_every_job.rs` asserts
    # both this and that every job above appears in `needs:`.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on every covered job
        env:
          CLASSIFY: ${{ needs.classify.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          WINARM: ${{ needs.windows-arm64-package.result }}
          SANDBOX: ${{ needs.sandbox-runtime.result }}
          DOCS: ${{ needs.docs.result }}
          ASSERTIONS: ${{ needs.assertions.result }}
        run: |
          status=0
          check() {
            case "$2" in
              # `skipped` is satisfied: a job that did not need to run is not a failure. That is the
              # whole point -- a documentation-only run skips lint and test, and this stays green.
              success|skipped) printf 'ok       %-12s %s\n' "$1" "$2" ;;
              *) printf 'BLOCKED  %-12s %s\n' "$1" "$2"; status=1 ;;
            esac
          }
          check classify "$CLASSIFY"
          check lint "$LINT"
          check test "$TEST"
          check windows-arm64 "$WINARM"
          check sandbox "$SANDBOX"
          check docs "$DOCS"
          check assertions "$ASSERTIONS"
          {
            echo "### ci complete"
            echo
            echo "| job | result | gated |"
            echo "| --- | --- | --- |"
            echo "| classify | \`$CLASSIFY\` | yes |"
            echo "| lint | \`$LINT\` | yes |"
            echo "| test | \`$TEST\` | yes |"
            echo "| windows-arm64-package | \`$WINARM\` | yes |"
            echo "| sandbox-runtime | \`$SANDBOX\` | yes |"
            echo "| docs | \`$DOCS\` | yes |"
            echo "| assertions | \`$ASSERTIONS\` | yes |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
