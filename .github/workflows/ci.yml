name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is feature 023's escape hatch: applying the `full-ci` label must start a *fresh*
    # run, because re-running an existing one replays the original event payload and would never
    # see a label added afterwards. Removing the label is deliberately not a trigger -- the next
    # push reclassifies anyway, and a full run someone asked for costs nothing to keep.
    types: [opened, synchronize, reopened, labeled]
  # Nightly (#952): the path-gated jobs run on main whatever the day's merges touched, so a break that no pull request's paths exposed is caught within a day.
  # A scheduled run has no base ref, so `classify` reports code-affecting and the whole pipeline
  # runs; `ci complete` goes red with it, which is the visible failure. Scheduled workflows run on
  # the default branch only.
  schedule:
    - cron: "17 3 * * *"

# One live run per pull request. `labeled` fires once per label, so a PR opened with labels already
# attached -- every Dependabot PR -- started a full pipeline per label for the same commit and queued
# the runners behind five copies. A newer run supersedes an older one safely: its payload carries
# every label on the PR at that moment, `full-ci` included. Pushes to main key on the run id, so they
# never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Diff guardrails (#1931), one switch each, read by `ci-complete`. `true` makes that job's red
  # result block a merge; `false` keeps it advisory (shown, never blocking). To flip one, change the
  # value here and nothing else. Scope and threshold: scripts/guardrails-scope.conf;
  # docs/development/diff-guardrails.md.
  GUARDRAIL_COVERAGE_BLOCK: "true"
  GUARDRAIL_MUTANTS_BLOCK: "false"
  CARGO_TERM_COLOR: always
  # See the matching note in release.yml. The shared target directory in .cargo/config.toml is a
  # local-machine concession to many concurrent worktrees; on a runner it only breaks
  # Swatinem/rust-cache, which caches ./target and would restore and save nothing.
  CARGO_TARGET_DIR: target

jobs:
  # Which paths did this change touch? (Feature 023.) Every skip below keys off this verdict, and
  # this job is the only one that asks the question -- the decision itself lives in
  # `scripts/classify-change.sh`, which is driven by `scripts/tests/classify-change.test.sh`, so
  # the workflow carries no rule of its own.
  classify:
    name: classify change
    runs-on: ubuntu-latest
    # #959: `pr-proven.sh` reads the commit's pull requests and trees through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.verdict.outputs.docs_only }}
      packaging: ${{ steps.verdict.outputs.packaging }}
      daemon_runtime: ${{ steps.verdict.outputs.daemon_runtime }}
      # #1981: a path declared `micold-kube` (chart, orchestrator image, kind harness) changed.
      kube_paths: ${{ steps.verdict.outputs.kube_paths }}
      # #956: the `full-ci` label as a boolean.
      full_ci: ${{ steps.verdict.outputs.full_ci }}
      # #959: a push to main whose tree a merged pull request's run already proved. True skips what
      # that run covered (lint, assertions, the Ubuntu test leg); see docs/development/ci-pipeline.md.
      pr_proven: ${{ steps.proven.outputs.pr_proven }}
      test_os: ${{ steps.proven.outputs.test_os }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the classification is against the merge base, not the last commit
      - name: Classify
        id: verdict
        env:
          # The escape hatch: label a pull request `full-ci` to force the whole pipeline. The
          # `labeled` trigger above exists so that applying it starts a fresh run -- re-running an
          # existing run replays the original event payload and would not see the new label.
          FORCE_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -o pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            # A pull request. `fetch-depth: 0` does NOT create `origin/<base>`, which is why the
            # `assertions` job below fetches explicitly despite using it too. Without this the
            # classifier reports `base ref unavailable`, every run falls back to the full pipeline,
            # and the feature silently never fires.
            git fetch --quiet origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            # A push. `before` is the previous tip; it is all zeroes for a new branch and may no
            # longer exist after a force push. The script treats both as code-affecting.
            BASE="${{ github.event.before }}"
          fi
          scripts/classify-change.sh "$BASE" HEAD 2> "$RUNNER_TEMP/offenders.txt" \
            | tee -a "$GITHUB_OUTPUT"
          echo "full_ci=$FORCE_FULL_CI" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/offenders.txt"
      # #959: a push to main repeats the PR run unless the merged PR's head tree is the pushed tree.
      # Only a push can be proven; the nightly schedule and pull requests are always false, so the
      # nightly keeps running everything. Any doubt in the script is false. `test_os` is the matrix
      # of the `test` job: the Ubuntu leg is dropped when proven (its full test ran on the PR).
      - name: Was this push proven by its pull request?
        id: proven
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          out="$RUNNER_TEMP/proven.txt"
          printf 'pr_proven=false\npr_proven_reason=not a push\n' > "$out"
          if [ "$EVENT" = push ]; then
            scripts/pr-proven.sh > "$out" || printf 'pr_proven=false\npr_proven_reason=script failed\n' > "$out"
          fi
          cat "$out"
          if grep -qx 'pr_proven=true' "$out"; then
            echo 'pr_proven=true' >> "$GITHUB_OUTPUT"
            echo 'test_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'pr_proven=false' >> "$GITHUB_OUTPUT"
            echo 'test_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
          sed -n 's/^pr_proven_reason=/PR-proven reason: /p' "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarise the verdict
        if: always()
        env:
          DOCS_ONLY: ${{ steps.verdict.outputs.docs_only }}
          PACKAGING: ${{ steps.verdict.outputs.packaging }}
          DAEMON_RUNTIME: ${{ steps.verdict.outputs.daemon_runtime }}
          KUBE_PATHS: ${{ steps.verdict.outputs.kube_paths }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            headline="**Documentation-only change** — lint, build and test are skipped."
          else
            headline="**Code-affecting change** — the full pipeline runs."
          fi
          {
            echo "### classify change"
            echo
            echo "$headline"
            echo
            echo "Reason: \`${REASON:-unavailable}\`"
            echo
            echo "Packaging paths touched: \`${PACKAGING:-unavailable}\`"
            echo
            echo "Daemon-runtime paths touched: \`${DAEMON_RUNTIME:-unavailable}\`"
            echo
            echo "Kube paths touched: \`${KUBE_PATHS:-unavailable}\`"
            if [ -s "$RUNNER_TEMP/offenders.txt" ]; then
              echo
              echo '<details><summary>Paths that made this code-affecting</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/offenders.txt"
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Formatting + lints run once on Linux (they are platform-independent).
  lint:
    name: fmt + clippy
    needs: classify
    # #959: a push to main that its merged pull request already proved skips lint.
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.pr_proven != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      # FR-040: the render-free core must lint clean on its own (no iced/PTY in scope).
      - name: clippy (render-free core)
        run: cargo clippy -p micold-core --all-targets -- -D warnings
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The shell-side suites: the documentation-set declaration, the change classifier, and the
      # assertion-freeze gate. They gate what CI skips and what it blocks, so they are enforced
      # here rather than only locally.
      # Linux-only by design -- the classifier runs nowhere else (see plan.md's Complexity
      # Tracking).
      - name: Test (shell suites)
        run: |
          for t in scripts/tests/*.test.sh; do
            echo "== $t"
            "$t"
          done

  # Feature 806 (FR-009): the two static Linux daemons every package carries, built once here on
  # Linux and handed to the jobs that need them as an artifact.
  linux-daemons:
    name: static Linux daemons (musl)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/install-zigbuild
      - name: Build the Linux daemons
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          scripts/remote-daemon-bundle.sh --out target/remote-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-daemons
          path: target/remote-daemon/micold-daemon-linux-*
          retention-days: 7

  # Linux is the only supported platform (#1897), so the matrix has one leg (`test_os` in `classify`).
  test:
    name: build + test (${{ matrix.os }})
    # Fail fast (#957): wait on `lint` (fmt + clippy, ~95 s) so a red lint ends the run in about 2 min
    # instead of ~25. A `needs` job is skipped, not failed, when lint fails; `ci-complete` reads
    # lint's own `failure` and goes red. #959: lint is also skipped on a push its pull request
    # proved, and a plain `if:` would then skip this job too, so the condition spells out what
    # success() implied: every need succeeded, except that lint may be skipped (never failed).
    needs: [classify, lint, linux-daemons]
    if: >-
      ${{ !cancelled()
      && needs.classify.result == 'success'
      && needs.lint.result != 'failure'
      && needs.linux-daemons.result == 'success'
      && needs.classify.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # #959: the Ubuntu leg is dropped on a push its pull request proved (its full test ran there).
        os: ${{ fromJSON(needs.classify.outputs.test_os || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # #1948: the orchestrator's shared store suite runs on PostgreSQL too. The cases skip when
    # MICOLD_TEST_POSTGRES_URL is unset; MICOLD_REQUIRE_POSTGRES=1 turns that skip into a failure
    # here, so a missing service cannot pass silently. Each case creates and drops its own database.
    env:
      POSTGRES_USER: micold
      POSTGRES_PASSWORD: micold-ci
      POSTGRES_DB: micold
      MICOLD_TEST_POSTGRES_URL: postgres://micold:micold-ci@localhost:5432/micold
      MICOLD_REQUIRE_POSTGRES: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: micold
          POSTGRES_PASSWORD: micold-ci
          POSTGRES_DB: micold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micold -d micold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview # cargo-llvm-cov, below
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
      - name: Install iced system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Drop the vendor apt repositories the runner image preconfigures (Microsoft's
          # `azure-cli` and `prod`, Google Chrome) before updating. Every package installed below
          # comes from the Ubuntu archive; none has ever come from those. But `apt-get update`
          # exits 100 if *any* configured repository fails, so an outage in software this project
          # does not use fails the job -- as one did on 2026-08-27, when packages.microsoft.com
          # answered 403 for both of its repositories and the only consequence was a red build
          # that a re-run cleared.
          #
          # Emptying `sources.list.d` except for `ubuntu.sources` leaves the archive itself alone on
          # both runner generations: jammy keeps it in `/etc/apt/sources.list`, noble in
          # `sources.list.d/ubuntu.sources`. Deleting by exception rather than by `*.list` matters
          # because the vendor repositories are defined as `.list` on one image generation and as
          # deb822 `.sources` on the other. If a future image moved the archive somewhere this does
          # remove, the install below would fail immediately on a missing package rather than
          # silently install the wrong thing.
          sudo find /etc/apt/sources.list.d -mindepth 1 -not -name ubuntu.sources -delete
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev strace
          # The orchestrator's FR-008 proof (crates/micold-daemon/tests/orchestrator/netns.rs) runs
          # under `unshare -rn` and `strace`, and fails in CI rather than skipping. ubuntu-24.04
          # restricts unprivileged user namespaces through AppArmor; lift that (absent on 22.04).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Issue #1649: the "Test (full workspace)" step below runs with nextest, matching
      # `mise run gate`/`mise run test` (docs/development/shared-build.md, mise.toml's
      # `github:nextest-rs/nextest` tool comment). Downloaded straight from the project's pinned
      # GitHub release and checksummed, rather than through a third-party action, so this trusts
      # only GitHub's own release host for a binary CI would otherwise need ~4 minutes to build
      # from source with `cargo install cargo-nextest --locked`.
      - name: Install cargo-nextest
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver=cargo-nextest-0.9.150
          asset="$ver-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "https://github.com/nextest-rs/nextest/releases/download/$ver/$asset"
          echo "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  $asset" | sha256sum -c -
          tar xzf "$asset" cargo-nextest
          # /usr/local/bin is root-owned on the runner image, like the kind/kubectl and lychee
          # installs elsewhere in this workflow.
          sudo install -m 0755 cargo-nextest /usr/local/bin/
      # #1931: the full-workspace step runs through `cargo llvm-cov nextest`, so the suite runs once
      # and also writes the lcov file the `diff-coverage` job reads. Pinned and checksummed like
      # nextest above.
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver=v0.9.1
          asset="cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "https://github.com/taiki-e/cargo-llvm-cov/releases/download/$ver/$asset"
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  $asset" | sha256sum -c -
          tar xzf "$asset" cargo-llvm-cov
          sudo install -m 0755 cargo-llvm-cov /usr/local/bin/
      # Principle I: the render-free core compiles and passes with no iced/PTY (FR-040).
      - name: Test (render-free core, no GUI)
        run: cargo test -p micold-core --all-targets
      # Ensure the full workspace (client GUI binary + daemon) compiles.
      - name: Build (workspace)
        run: cargo build --workspace
      # Feature 020's gates, the 017 gates it widened, BUG-001's, feature 021's architecture guards,
      # and feature 027's two client-side §A gates. These read source text, one `const` slice and a
      # reducer — they open no window — and this step is the authoritative list of them.
      #
      # This list is enumerated, so it drifts silently: a §A gate added to the quickstart's table and
      # not added here still runs in the full-workspace step below.
      # `micold-core/tests/quickstart_a_runs_everywhere.rs` compares the two.
      - name: Test (component library, showcase, and architecture gates, all platforms)
        shell: bash
        run: |
          cargo test -p micold-client \
            --test showcase_completeness \
            --test showcase_determinism \
            --test showcase_captions \
            --test packaging_excludes_showcase \
            --test material_boundary \
            --test idle_requests_no_frames \
            --test animated_layout_relayouts \
            --test feature_registration_cost \
            --test service_capability_fakes \
            --test popover_displacement \
            --test features_session \
            --test features_settings \
            --test features_sidebar \
            --test anatomy_call_sites
          # Modules of the merged `main` test target (#1650): the filters keep this run to them.
          cargo test -p micold-client --test main -- \
            showcase_isolation:: \
            showcase_state:: \
            showcase_glue:: \
            material_builder_api:: \
            feature_write_isolation:: \
            root_is_routing_only:: \
            root_vocabulary_is_cross_cutting:: \
            root_state_is_shared:: \
            logical_state_ownership:: \
            features_are_render_free:: \
            no_concrete_implementations:: \
            overlay_registration:: \
            surface_registration_cost:: \
            outcome_termination:: \
            attention_notify:: \
            attention_view_report:: \
            unread_rows:: \
            switcher_unread:: \
            attention_reveal:: \
            features_attention:: \
            features_connection:: \
            features_help:: \
            features_notifications:: \
            features_project:: \
            features_window:: \
            features_worktree:: \
            features_worktree_form:: \
            notification_icon::
      # Run the client + daemon test suites where the iced system deps are present. Issue #1649:
      # nextest does not run doctests at all, so `cargo test --doc` still runs them on its own --
      # dropping it would silently stop testing every `/// ```rust` example.
      - name: Test (full workspace)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Both run even if one fails, so a single failing test does not hide a doctest failure
          # (or vice versa) behind set -e / shell && (issue #1649 review finding). --no-fail-fast:
          # unlike `cargo test`, nextest stops the whole run after the first failing test by
          # default, which would hide every later failure.
          # #1931: nextest runs instrumented (`cargo llvm-cov nextest`) and writes lcov.info for the
          # `diff-coverage` job. The doctests and the release frame-budget step below stay outside
          # the instrumented run. So do the wall-clock budget tests in TIMED: instrumentation slows
          # them past their bounds (PR #1933's first run: ten_busy_sessions_are_all_saved_within_the_bound
          # lost a session's save). They run right after, uninstrumented; add a budget test here when
          # it only fails under coverage.
          TIMED='package(micold-daemon) & (binary(=history_timing) | (binary(=history_stop_request) & test(=ten_busy_sessions_are_all_saved_within_the_bound)))'
          nextest_rc=0
          cargo llvm-cov nextest --workspace --no-fail-fast -E "not ($TIMED)" --lcov --output-path lcov.info || nextest_rc=$?
          timed_rc=0
          cargo nextest run -p micold-daemon --test history_timing --test history_stop_request --no-fail-fast -E "$TIMED" || timed_rc=$?
          doc_rc=0; cargo test --doc --workspace || doc_rc=$?
          for rc in "$nextest_rc" "$timed_rc" "$doc_rc"; do [ "$rc" -eq 0 ] || exit "$rc"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('lcov.info') != '' }}
        with:
          name: lcov
          path: lcov.info
          retention-days: 7
      # Feature 021's frame budget (SC-002) is a release-build number, so its measurements are
      # ignored in the debug suite above and run here instead (BUG-003).
      - name: Test (type-ahead frame budget, release)
        if: runner.os == 'Linux'
        run: |
          cargo test --release -p micold-core --test typeahead_budget
          cargo test --release -p micold-core --test main -- jira_site_release::
          cargo test --release -p micold-core --lib review::anchor::tests::two_hundred_comments_locate_inside_the_budget
          cargo test --release -p micold-client --test transcript_open_budget

  # #1931: do the tests run the lines this pull request changed? Reads the lcov file the `test` job
  # wrote and checks the changed executable lines in scope (scripts/guardrails-scope.conf) against
  # it, 80% by default. Pull requests only: a push has no base. Skipped (so satisfied) when `test`
  # was, as on a documentation-only change. Whether red blocks is GUARDRAIL_COVERAGE_BLOCK.
  diff-coverage:
    name: diff coverage
    needs: [classify, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lcov
      - name: Check the changed lines
        env:
          BASE: ${{ github.base_ref }}
        run: scripts/diff-coverage.py --lcov lcov.info --base "origin/$BASE" --summary diff-coverage.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: diff-coverage
          path: |
            lcov.info
            diff-coverage.md
          retention-days: 7

  # #1931: do the tests notice a change to the lines this pull request changed? `cargo mutants
  # --in-diff` mutates only those lines (scripts/mutants-diff.sh), each mutant tested by its own
  # crate's tests under nextest. Slow, so it is capped at 30 minutes and skipped on a
  # documentation-only change. Whether red blocks is GUARDRAIL_MUTANTS_BLOCK (advisory by default).
  mutants:
    name: mutants on the diff
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
      - name: Allow the namespace tests the unmutated baseline runs
        # Same setup as the test job: the orchestrator netns proof runs under `unshare -rn` and
        # `strace`, which ubuntu-24.04 restricts through AppArmor.
        run: |
          sudo apt-get install -y strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install cargo-nextest and cargo-mutants
        run: |
          set -euo pipefail
          ver=cargo-nextest-0.9.150
          asset="$ver-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "https://github.com/nextest-rs/nextest/releases/download/$ver/$asset"
          echo "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  $asset" | sha256sum -c -
          tar xzf "$asset" cargo-nextest
          sudo install -m 0755 cargo-nextest /usr/local/bin/
          ver=v27.1.0
          asset="cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLO "https://github.com/sourcefrog/cargo-mutants/releases/download/$ver/$asset"
          echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  $asset" | sha256sum -c -
          tar xzf "$asset" cargo-mutants
          sudo install -m 0755 cargo-mutants /usr/local/bin/
      - name: Mutate the changed lines
        env:
          BASE: ${{ github.base_ref }}
        run: scripts/mutants-diff.sh "origin/$BASE" mutants-diff-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-diff
          path: mutants-diff-out
          retention-days: 7

  # Feature 027. The sandbox adapter layer is tested by the `test` job above, against an injected
  # fake runner with nothing installed. This job covers the part a fake cannot: that the argv we construct
  # is accepted by a real container runtime, and that the isolation it produces is real.

  sandbox-runtime:
    name: sandbox against a real runtime (linux)
    # Waits on `lint` (#957), see the `test` job.
    needs: [classify, lint]
    # Pull requests run it only when a path declared `micold-daemon-runtime` changed (or the
    # `full-ci` label forces `daemon_runtime=true`); main pushes and the nightly schedule always run
    # it. A skipped job satisfies `ci-complete`. An unset output (classify failed) is not 'true',
    # but then `docs_only` is unset too and `classify` itself is red, which blocks `ci-complete`.
    # #959: lint may be skipped on a proven push, so the condition names its needs (see `test`).
    if: >-
      ${{ !cancelled()
      && needs.classify.result == 'success'
      && needs.lint.result != 'failure'
      && needs.classify.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || needs.classify.outputs.daemon_runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Runtime version
        run: docker version --format '{{.Server.Version}}' && docker info --format '{{.Driver}}'
      # Every test behind `sandbox-real-runtime` starts from `micold-basic:dev` (feature 806): the
      # basic image holds sshd and the session tools, and each test provisions its own daemon into
      # it over SSH, as the client does. A runner has no such image, and the failure is not a
      # helpful one: the first test to want it dies on `No such image` and cargo stops there, so
      # the targets after it never run at all.
      #
      # Built from this tree, so a change under `packaging/basic/` is tested before
      # `basic-image.yml` publishes it on merge. This is `mise run image` without `mise`.
      - name: Build the :dev basic image
        run: docker build -f packaging/basic/Containerfile -t micold-basic:dev packaging/basic
      # The digest the application pins must still be pullable: a pin that points nowhere makes
      # every first start fail (feature 806, FR-003).
      - name: Check the pinned basic image exists
        run: |
          set -e
          pin="$(grep -o 'ghcr.io/jaroslawherod/micold-basic:[^"]*' crates/micold-core/src/sandbox/basic_image.rs | head -1)"
          echo "pin: $pin"
          docker manifest inspect "$pin" >/dev/null
      # `sandbox_real_` is a *test-name* filter, not a file filter: cargo matches it against the
      # test function's path, and an integration target's name is not part of that path. So a test
      # in `tests/sandbox_real_*.rs` whose function is not also named `sandbox_real_*` runs locally
      # and is silently skipped here — no failure, just a smaller number in the summary. Every
      # real-runtime test therefore carries the prefix in its own name.
      - name: Test (real runtime, adapter layer)
        run: cargo test -p micold-core --features sandbox-real-runtime sandbox_real_ -- --test-threads=1
      # The other half, and the half that carries the feature's headline claims. `micold-core`'s
      # real-runtime targets cover the adapter -- argv a runtime accepts, the isolation it produces
      # -- while `micold-daemon`'s cover what that isolation is *for*: the boundary probed from
      # inside a session the daemon spawned (US1), terminal parity against a host daemon (US2),
      # limits stopping the session and not the service (US4), the image carrying every AI CLI the
      # application offers (FR-023a), the fingerprint refusal (FR-024d), and sessions surviving a
      # client restart with the survival opt-in bringing the sandbox back unasked (FR-014a/b/c).
      #
      # They ran on no machine at all until now. The step above says `-p micold-core`, so cargo
      # never built this crate's targets, and eleven tests -- including quickstart §B.2, which says
      # in writing that its boxes "re-check themselves on every sandbox-runtime CI run" -- were
      # verified exactly once, by hand, in the T120 pass. A test nothing runs is documentation.
      #
      # `--release` is required rather than preferred. The daemon inside the image is release-built,
      # and `sandbox_real_session_start` compares it against `CARGO_BIN_EXE_micold-daemon`, which is
      # whatever profile this run used: a debug host daemon against a release containerised one
      # flatters the container, which is the wrong direction for "the sandbox is not much slower".
      # The test refuses to report a number when the profiles disagree -- and refusing is a failure,
      # which is why `--no-fail-fast` is here too. Without it cargo stops at that target and every
      # target after it is skipped in silence, `sandbox_real_staleness` included.
      #
      # Issue 955: the step builds only the `sandbox_real_*` integration targets (`--test
      # 'sandbox_real_*'`, a cargo glob) instead of every test binary of the crate. A run of this
      # step spent ~930 s of its ~950 s compiling 149 release test binaries for 25 tests that take
      # ~16 s; the 25 tests all live in those targets (`-- --list` gives 25 with and without the
      # glob), and the daemon has no `sandbox_real_` doctests, so none are lost.
      - name: Test (real runtime, daemon)
        run: cargo test --release -p micold-daemon --features sandbox-real-runtime --test 'sandbox_real_*' sandbox_real_ --no-fail-fast -- --test-threads=1

  # #1281. The container daemon a user adds in Settings, end to end against a real runtime, on
  # docker **and** on rootless podman. The job above starts its containers with the harness's own
  # `create` argv, so a mount option podman rejects in the application's argv (#1279) passed it and
  # reached users. This job creates the container the way Settings does (`DaemonContainers`, the
  # credential tmpfs, the worktree bind and the uid/gid mapping included) from `micold-basic:dev`
  # built from the branch, and drives the app's own connection actor: the daemon is provisioned
  # over SSH with a stand-in AI CLI, a session starts, the stand-in answers, the session stops and
  # the container is removed. A rejected option ends the start with the runtime's own output, which
  # the test prints as its failure.
  #
  # `MICOLD_REAL_RUNTIME_REQUIRED` turns the tests' skip (no runtime, no image) into a failure, and
  # the last step checks that both tests passed and that the end-to-end one reached its end, so a
  # broken harness or a filter that matches nothing cannot pass with nothing run. Same gate as the
  # job above. `micold-ai-ide` is the binary the tests are compiled into (`src/shell/sandbox_real.rs`);
  # `--bin` keeps cargo from building the crate's other test targets.
  container-daemon:
    name: container daemon end to end (${{ matrix.runtime }}, linux)
    # Waits on `lint` (#957), see the `test` job.
    needs: [classify, lint]
    if: >-
      ${{ !cancelled()
      && needs.classify.result == 'success'
      && needs.lint.result != 'failure'
      && needs.classify.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || needs.classify.outputs.daemon_runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      MICOLD_TEST_RUNTIME: ${{ matrix.runtime }}
      MICOLD_REAL_RUNTIME_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runtime }}
      # podman runs as the runner user, rootless: the setup a user without root has, and the one
      # #1279 broke. A rootful podman here would prove something else.
      - name: Runtime version
        run: |
          set -e
          if [ "$MICOLD_TEST_RUNTIME" = podman ]; then
            podman version --format '{{.Client.Version}}'
            rootless="$(podman info --format '{{.Host.Security.Rootless}}')"
            echo "rootless: $rootless"
            [ "$rootless" = true ] || { echo "::error::podman is not rootless" >&2; exit 1; }
          else
            docker version --format '{{.Server.Version}}'
          fi
      - name: Build the :dev basic image
        run: '"$MICOLD_TEST_RUNTIME" build -f packaging/basic/Containerfile -t micold-basic:dev packaging/basic'
      # #1439 quickstart B3: the sandbox page's own-image example builds as written on this
      # runtime, `FROM` the image just built, and `pkg-config --libs libpq` prints `-lpq` in it.
      - name: Build the user guide's own-image example
        run: scripts/check-guide-own-image.sh "$MICOLD_TEST_RUNTIME" micold-basic:dev
      # The build the provisioning copies into the container; the test finds it beside its own
      # `deps/` directory.
      - name: Build the daemon
        run: cargo build -p micold-daemon
      - name: Test (container daemon end to end)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/container-daemon.log"
          cargo test -p micold-client --bin micold-ai-ide --features sandbox-real-runtime sandbox_real_ \
            --no-fail-fast -- --test-threads=1 --nocapture 2>&1 | tee "$log"
          passed="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$log" | tail -1)"
          echo "passed: ${passed:-0}"
          [ "${passed:-0}" -ge 2 ] || { echo "::error::expected both container-daemon tests to pass, ${passed:-0} did" >&2; exit 1; }
          grep -E "$MICOLD_TEST_RUNTIME: connected after" "$log" \
            || { echo "::error::the end-to-end test did not reach its end" >&2; exit 1; }

  # Constitution Principle VII: documentation ships and is verified in CI.
  # Feature 021 (FR-027): the restructuring treats the existing suite as its behavior
  # specification, which only works while the assertions are frozen.
  #
  # The job runs on every branch, but the rule it enforces does not apply to every branch: FR-027
  # binds changes made *for feature 021*, and every other feature owns its own expectations. The
  # script decides that for itself and reports without failing when out of scope (spec.md Q3).
  #
  # Blocking as of T074, and the thing that made that possible is not a lower false-positive rate
  # -- it is that a false positive can now be answered. FR-027 forbids expectations being relaxed,
  # rewritten or deleted; it cannot forbid an assertion's *spelling* changing when the thing it
  # names changes shape, and spec.md Q3 refuses to let the check guess which is which. So a removal
  # is either reinstated or adjudicated in specs/021-mvu-slice-architecture/assertion-adjudications.md,
  # under a heading naming the task and with the reason, and the check re-verifies every entry
  # against the current tree on every run: an adjudication whose assertion is no longer missing
  # fails just as loudly. Scope still applies -- out of scope this reports in full and exits 0, so
  # a concurrent feature is told what it did to the suite without being blocked.

  # Feature 489. The remote daemon is reached with the user's own `ssh`; this job runs the
  # `ssh_real_*` tests against a rootless `sshd` on loopback (no root, no container). The argv
  # builders are covered by the `test` job.
  ssh-remote:
    name: remote daemon over a real sshd (linux)
    # Waits on `lint` (#957), see the `test` job.
    needs: [classify, lint]
    # Pull requests run it only when a path declared `micold-daemon-runtime` changed (or the
    # `full-ci` label forces `daemon_runtime=true`); main pushes and the nightly schedule always run
    # it. A skipped job satisfies `ci-complete`. An unset output (classify failed) is not 'true',
    # but then `docs_only` is unset too and `classify` itself is red, which blocks `ci-complete`.
    # #959: lint may be skipped on a proven push, so the condition names its needs (see `test`).
    if: >-
      ${{ !cancelled()
      && needs.classify.result == 'success'
      && needs.lint.result != 'failure'
      && needs.classify.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || needs.classify.outputs.daemon_runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Run the real-sshd tests
        run: cargo test -p micold-daemon --features ssh-real-runtime ssh_real_ --no-fail-fast -- --test-threads=1

  # Feature 686 (FR-021, research K12/K13). The Kubernetes daemon runtime is proven against a real
  # cluster: a throwaway `kind` cluster, the SSH image (the basic image plus a package source
  # pointed at the suite) loaded into it, and the `kube_real_*` tests of `micold-client`. The
  # client-side rules (kubeconfig candidates, separators, exec-plugin resolution) are pure core tests
  # that the `test` job runs.
  # `kind` and `kubectl` are pinned by version and sha256, and the node image is one stable
  # Kubernetes version, so the job is the same on every run. It runs on every non-documentation
  # change (the docs-only skip of `ssh-remote`, without its path gate).
  kube-cluster:
    name: kubernetes daemon on a real cluster (linux)
    # Waits on `lint` (#957), see the `test` job.
    needs: [classify, lint]
    if: >-
      ${{ !cancelled()
      && needs.classify.result == 'success'
      && needs.lint.result != 'failure'
      && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_VERSION: v0.30.0
      KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
      KUBECTL_VERSION: v1.34.0
      KUBECTL_SHA256: cfda68cba5848bc3b6c6135ae2f20ba2c78de20059f68789c090166d6abc3e2c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install kind and kubectl at pinned versions
        run: |
          set -euo pipefail
          curl -sSLfo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          curl -sSLfo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check
          sudo install -m 0755 kind kubectl /usr/local/bin/
      - name: Run the real-cluster tests
        run: scripts/test-kube.sh

  kube-chart:
    name: helm chart and orchestrator image (linux)
    # #1981 (FR-005): the chart's lint, schema and conformance checks, and the orchestrator image's
    # build and smoke run, with no cluster. Pull requests run it only when a path declared
    # `micold-kube` changed (or the `full-ci` label forces `kube_paths=true`); main pushes and the
    # nightly schedule run it unless (#959) the push's pull request already proved it: proven and
    # in the kube set means the PR ran this job. A skipped job satisfies `ci-complete`.
    needs: classify
    if: >-
      ${{ !cancelled()
      && needs.classify.result == 'success'
      && needs.classify.outputs.docs_only != 'true'
      && (needs.classify.outputs.pr_proven != 'true' || needs.classify.outputs.kube_paths != 'true')
      && (github.event_name != 'pull_request' || needs.classify.outputs.kube_paths == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm and kubeconform at pinned versions
        run: |
          set -euo pipefail
          scripts/install-kube-tools.sh helm kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The pinned-tools script's own cases
        run: scripts/tests/install-kube-tools.test.sh
      - name: The chart check's own cases
        run: scripts/tests/chart-check.test.sh
      - name: Lint, validate and conformance-test the chart
        # What `mise run chart-check` runs.
        run: scripts/chart-check.sh
      - name: Build the orchestrator image and run it as UID 65532
        env:
          DOCKER_BUILDKIT: "1"
        run: scripts/chart-check.sh --image

  assertions:
    name: assertion freeze
    needs: classify
    # #959: skipped on a push its pull request already proved (the check ran there).
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.pr_proven != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs history to diff against the base ref
      # The gate's own cases, before the gate runs. They existed and nothing ran them, which is how
      # a staleness rule that failed on every branch cut from main reached main: the suite is the
      # only place that mistake is cheap to catch, and it was being asked on no machine at all.
      - name: The check's own cases
        run: scripts/tests/check-assertions-frozen.test.sh
      - name: Assertions frozen since base
        env:
          # A pull request checks out a detached merge commit, so the branch name is not in the
          # repository to be read -- and it is one of the two signals scope is decided from.
          FREEZE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch --quiet origin "${{ github.base_ref || 'main' }}"
          scripts/check-assertions-frozen.sh "$BASE"

  # Deliberately unconditional (feature 023, FR-010): this is the one gate a documentation-only
  # change can actually break, so skipping the build must not skip it. No `needs: classify`, no
  # `if:`.
  docs:
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the user-guide gate below compares against the merge base
      - name: Required user-guide docs exist
        run: |
          test -f docs/user-guide/help-about.md
          test -f docs/user-guide/project-selection.md
          test -f docs/user-guide/appearance-theming.md
          test -f docs/user-guide/settings.md
          test -f docs/user-guide/sandboxed-daemon.md
          test -f docs/user-guide/remote-daemons.md
          test -f docs/user-guide/worktrees-and-sessions.md
          test -f docs/user-guide/icons.md
      # Principle VII for a developer-facing capability: feature 020's showcase is documented for
      # developers rather than in the user guide (its FR-024), and the doc ships in the same change.
      - name: Required developer docs exist
        run: |
          test -f docs/development/architecture.md
          test -f docs/development/component-library.md
          test -f docs/development/component-showcase.md
          # Feature 023 is developer-facing, so Principle VII is satisfied here rather than in the
          # user guide. This check runs on documentation-only changes too -- which is the point.
          test -f docs/development/ci-pipeline.md

      # Constitution Principle VII, the half that was not mechanical. "Every user-facing feature
      # MUST ship with corresponding user-guide documentation in the same change" was enforced by
      # the docs *build* passing and by review noticing -- and review is what skips it when the
      # diff is long and the feature works. The rule lives in `scripts/check-user-guide-updated.sh`
      # and the path declaration in `.gitattributes`, so this workflow carries none of it.
      #
      # In this job rather than one of its own, deliberately: a new job would have to be added to
      # `ci-complete`'s `needs:` AND to the required-check name in the default branch's ruleset,
      # which lives outside this repository. `docs` also already runs unconditionally, which is
      # what a gate about documentation needs.
      #
      # The check's own cases run FIRST, as they do for the criteria gate below -- the
      # assertion-freeze gate shipped with cases that existed and nothing ran, and this ordering is
      # how that stops repeating.
      - name: The user-guide gate's own cases
        run: scripts/tests/check-user-guide-updated.test.sh
      - name: A user-facing feature updates the user guide
        # Pull requests only: this is a pre-merge gate, and the label that waives it lives on a
        # pull request. A push to main has already been through it.
        if: github.event_name == 'pull_request'
        env:
          # Passed as environment rather than interpolated into the script: a title is arbitrary
          # text somebody types, and `${{ }}` inside `run:` would put it in the shell's mouth.
          CHANGE_TITLE: ${{ github.event.pull_request.title }}
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        run: |
          # fetch-depth: 0 does NOT create `origin/<base>` -- the same trap the classify and
          # assertions jobs fetch explicitly to avoid.
          git fetch --quiet origin "${{ github.base_ref }}"
          scripts/check-user-guide-updated.sh "origin/${{ github.base_ref }}" HEAD

      # Feature 010, BUG-008. A success criterion that names no observable cannot be checked by
      # anyone who is not standing at the machine, so it is skipped -- and CI stays green while it
      # is, because nothing can fail a criterion nobody can run. This gate is deliberately in the
      # `docs check` job: the omission is made in a spec file, on documentation-only changes, which
      # is exactly when the rest of the pipeline is skipped.
      #
      # The check's own cases run FIRST, and this ordering is the point rather than tidiness: the
      # assertion-freeze gate beside it shipped with cases that existed and nothing ran, which is
      # this same bug one level down.
      - name: The criteria check's own cases
        run: scripts/tests/check-criteria-observables.test.sh
      - name: Every success criterion names its observable
        run: scripts/check-criteria-observables.sh

      # The pre-merge half of the documentation site's checks (feature 028). They are steps in this
      # job and not a job of their own, deliberately: `docs` is the one job feature 023 keeps running
      # on a documentation-only change, so it is the only place a check over documentation is
      # guaranteed to run at all -- and adding a job would mean adding it to `ci-complete`'s `needs:`
      # and to the required-check name the default branch's ruleset holds, which lives outside this
      # repository.
      #
      # lychee arrives as its published binary rather than through `cargo install`. This job has no
      # Rust toolchain and wants none: installing one and compiling a link checker would cost a
      # documentation-only change several minutes, which is the cost feature 023 exists to remove.
      # `pages.yml` installs it with cargo instead, because it already has the toolchain, the cache
      # and mdBook to install beside it.
      - name: Install lychee
        env:
          LYCHEE_TAG: lychee-v0.24.2
          LYCHEE_ASSET: lychee-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          base="https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_TAG"
          curl -fsSL -O "$base/$LYCHEE_ASSET" -O "$base/$LYCHEE_ASSET.sha256"
          sha256sum -c "$LYCHEE_ASSET.sha256"
          # The binary is inside a directory named after the asset, not at the root of the
          # archive -- `tar xzf "$LYCHEE_ASSET" lychee` finds nothing and fails the job.
          tar xzf "$LYCHEE_ASSET"
          sudo install -m 0755 "${LYCHEE_ASSET%.tar.gz}/lychee" /usr/local/bin/lychee
          rm -rf "$LYCHEE_ASSET" "$LYCHEE_ASSET.sha256" "${LYCHEE_ASSET%.tar.gz}"
          lychee --version
      - name: Every page is listed, and the theme is drawn from the tokens
        run: site/checks/page-set.sh
      - name: The pages, the media manifest and the scenes agree
        run: site/checks/media-references.sh
      - name: Every internal link in the sources resolves
        run: site/checks/links.sh --sources

  # The single status check the default branch's ruleset requires (feature 023). It states the
  # outcome of the run instead of enumerating the pipeline's internals, which is what lets the jobs
  # above be skipped on a documentation-only change without making a pull request unmergeable.
  # Requiring job names welds the merge gate to the pipeline's shape; requiring this one does not.
  #
  # See docs/development/ci-pipeline.md and
  # specs/023-docs-only-ci-skip/contracts/required-checks.md. Renaming this job breaks the merge
  # gate for every pull request, and no pull request can fix it -- the ruleset lives outside the
  # repository.
  ci-complete:
    name: ci complete
    needs: [classify, lint, test, linux-daemons, sandbox-runtime, container-daemon, ssh-remote, kube-cluster, kube-chart, assertions, docs, diff-coverage, mutants]
    # Load-bearing. Without it the implicit `success()` applies, so this job would be *skipped*
    # whenever a covered job failed -- and a skipped check reports success. The gate would go green
    # exactly when the run went red. `crates/micold-core/tests/ci_gate_covers_every_job.rs` asserts
    # both this and that every job above appears in `needs:`.
    if: always()
    runs-on: ubuntu-latest
    # #956: the grant is for this job alone, and only the notification step below uses it.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Gate on every covered job
        env:
          CLASSIFY: ${{ needs.classify.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          # A red `linux-daemons` skips `test` (it needs its artifact), and a skip reads as
          # satisfied, so it is gated by name too.
          LINUXDAEMONS: ${{ needs.linux-daemons.result }}
          SANDBOX: ${{ needs.sandbox-runtime.result }}
          CONTAINERDAEMON: ${{ needs.container-daemon.result }}
          SSHREMOTE: ${{ needs.ssh-remote.result }}
          KUBECLUSTER: ${{ needs.kube-cluster.result }}
          KUBECHART: ${{ needs.kube-chart.result }}
          DOCS: ${{ needs.docs.result }}
          ASSERTIONS: ${{ needs.assertions.result }}
          # #1931: the guardrails; whether each blocks is the workflow-level GUARDRAIL_* switch.
          DIFFCOVERAGE: ${{ needs.diff-coverage.result }}
          MUTANTS: ${{ needs.mutants.result }}
        run: |
          status=0
          check() {
            case "$2" in
              # `skipped` is satisfied: a job that did not need to run is not a failure. That is the
              # whole point -- a documentation-only run skips lint and test, and this stays green.
              success|skipped) printf 'ok       %-12s %s\n' "$1" "$2" ;;
              *) printf 'BLOCKED  %-12s %s\n' "$1" "$2"; status=1 ;;
            esac
          }
          # A guardrail whose switch is not "true" is advisory: its result is shown, never blocks.
          guardrail() {
            if [ "$3" = "true" ]; then check "$1" "$2"; else printf 'advisory %-12s %s\n' "$1" "$2"; fi
          }
          check classify "$CLASSIFY"
          check lint "$LINT"
          check test "$TEST"
          check linux-daemons "$LINUXDAEMONS"
          check sandbox "$SANDBOX"
          check container-daemon "$CONTAINERDAEMON"
          check ssh-remote "$SSHREMOTE"
          check kube-cluster "$KUBECLUSTER"
          check kube-chart "$KUBECHART"
          check docs "$DOCS"
          check assertions "$ASSERTIONS"
          guardrail diff-coverage "$DIFFCOVERAGE" "$GUARDRAIL_COVERAGE_BLOCK"
          guardrail mutants "$MUTANTS" "$GUARDRAIL_MUTANTS_BLOCK"
          {
            echo "### ci complete"
            echo
            echo "| job | result | gated |"
            echo "| --- | --- | --- |"
            echo "| classify | \`$CLASSIFY\` | yes |"
            echo "| lint | \`$LINT\` | yes |"
            echo "| test | \`$TEST\` | yes |"
            echo "| linux-daemons | \`$LINUXDAEMONS\` | yes |"
            echo "| sandbox-runtime | \`$SANDBOX\` | yes |"
            echo "| container-daemon | \`$CONTAINERDAEMON\` | yes |"
            echo "| ssh-remote | \`$SSHREMOTE\` | yes |"
            echo "| kube-cluster | \`$KUBECLUSTER\` | yes |"
            echo "| kube-chart | \`$KUBECHART\` | yes |"
            echo "| docs | \`$DOCS\` | yes |"
            echo "| assertions | \`$ASSERTIONS\` | yes |"
            echo "| diff-coverage | \`$DIFFCOVERAGE\` | $GUARDRAIL_COVERAGE_BLOCK |"
            echo "| mutants | \`$MUTANTS\` | $GUARDRAIL_MUTANTS_BLOCK |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # #956: a red `main` or nightly run must reach somebody. A pull request needs no notice (its author is watching the check).
      # `failure()` is true when the gate step above exited 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure() && github.event_name != 'pull_request'
      - name: Notify about the red run
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci-notify-failure.sh
