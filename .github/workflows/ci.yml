name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is feature 023's escape hatch: applying the `full-ci` label must start a *fresh*
    # run, because re-running an existing one replays the original event payload and would never
    # see a label added afterwards. Removing the label is deliberately not a trigger -- the next
    # push reclassifies anyway, and a full run someone asked for costs nothing to keep.
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  # See the matching note in release.yml. The shared target directory in .cargo/config.toml is a
  # local-machine concession to many concurrent worktrees; on a runner it only breaks
  # Swatinem/rust-cache, which caches ./target and would restore and save nothing.
  CARGO_TARGET_DIR: target

jobs:
  # Which paths did this change touch? (Feature 023.) Every skip below keys off this verdict, and
  # this job is the only one that asks the question -- the decision itself lives in
  # `scripts/classify-change.sh`, which is driven by `scripts/tests/classify-change.test.sh`, so
  # the workflow carries no rule of its own.
  classify:
    name: classify change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.verdict.outputs.docs_only }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the classification is against the merge base, not the last commit
      - name: Classify
        id: verdict
        env:
          # The escape hatch: label a pull request `full-ci` to force the whole pipeline. The
          # `labeled` trigger above exists so that applying it starts a fresh run -- re-running an
          # existing run replays the original event payload and would not see the new label.
          FORCE_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -o pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            # A pull request. `fetch-depth: 0` does NOT create `origin/<base>`, which is why the
            # `assertions` job below fetches explicitly despite using it too. Without this the
            # classifier reports `base ref unavailable`, every run falls back to the full pipeline,
            # and the feature silently never fires.
            git fetch --quiet origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            # A push. `before` is the previous tip; it is all zeroes for a new branch and may no
            # longer exist after a force push. The script treats both as code-affecting.
            BASE="${{ github.event.before }}"
          fi
          scripts/classify-change.sh "$BASE" HEAD 2> "$RUNNER_TEMP/offenders.txt" \
            | tee -a "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/offenders.txt"
      - name: Summarise the verdict
        if: always()
        env:
          DOCS_ONLY: ${{ steps.verdict.outputs.docs_only }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            headline="**Documentation-only change** — lint, build and test are skipped."
          else
            headline="**Code-affecting change** — the full pipeline runs."
          fi
          {
            echo "### classify change"
            echo
            echo "$headline"
            echo
            echo "Reason: \`${REASON:-unavailable}\`"
            if [ -s "$RUNNER_TEMP/offenders.txt" ]; then
              echo
              echo '<details><summary>Paths that made this code-affecting</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/offenders.txt"
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Formatting + lints run once on Linux (they are platform-independent).
  lint:
    name: fmt + clippy
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # FR-040: the render-free core must lint clean on its own (no iced/PTY in scope).
      - name: clippy (render-free core)
        run: cargo clippy -p micold-core --all-targets -- -D warnings
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The shell-side suites: the documentation-set declaration, the change classifier, and the
      # assertion-freeze gate. They gate what CI skips and what it blocks, so they are enforced
      # here rather than only locally.
      # Linux-only by design -- the classifier runs nowhere else (see plan.md's Complexity
      # Tracking).
      - name: Test (shell suites)
        run: |
          for t in scripts/tests/*.test.sh; do
            echo "== $t"
            "$t"
          done

  # Constitution Principle VI: Linux, macOS, and Windows. `fail-fast: false` so one platform's
  # failure still reports the others — the point of the matrix is seeing *which* platforms differ.
  test:
    name: build + test (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install iced system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      # Principle I: the render-free core compiles and passes with no iced/PTY (FR-040),
      # verified on every platform.
      - name: Test (render-free core, no GUI)
        run: cargo test -p micold-core --all-targets
      # Ensure the full workspace (client GUI binary + daemon) compiles on every platform.
      - name: Build (workspace)
        run: cargo build --workspace
      # Feature 020's gates, the 017 gates it widened, BUG-001's, feature 021's architecture guards,
      # and feature 027's two client-side §A gates. These read source text, one `const` slice and a
      # reducer — they open no window — so they run wherever the crate compiles, and this step is the authoritative list of them. Path
      # handling (`\` vs `/` in the scanners' display keys) is exactly the kind of difference a
      # Linux-only run would miss: several of these walk the source tree from `CARGO_MANIFEST_DIR`
      # and report findings by path.
      #
      # The feature-021 block was added at T079, and the reason it is here rather than in the
      # Linux-only step below is SC-006: "the complete pre-existing test suite passes on all three
      # supported platforms" is not met by a matrix that builds everywhere and runs a feature's own
      # guards in one place. Verified display-free before being widened — all 20 targets pass with
      # `DISPLAY` and `WAYLAND_DISPLAY` unset — and none constructs an iced runtime or a window.
      #
      # This list is enumerated, so it drifts silently: a §A gate added to the quickstart's table and
      # not added here still runs — on Linux, in the job below — and the three-platform claim quietly
      # stops being true. `micold-core/tests/quickstart_a_runs_everywhere.rs` compares the two.
      - name: Test (component library, showcase, and architecture gates, all platforms)
        # Windows defaults to `pwsh`, which does not treat `\` as a line continuation; pin bash so the
        # one readable multi-line invocation below parses identically on all three runners.
        #
        # Feature 028 adds three (T052 — FR-018): `root_vocabulary_is_cross_cutting`,
        # `root_state_is_shared` and `logical_state_ownership`. They belong here rather than only in
        # the Linux full-workspace run for the same reason the 021 block does — each reports its
        # findings *by path* (`features/sidebar.rs`, `ui/mod.rs`, `state.sidebar.expanded`), and a
        # `\` vs `/` difference in how a path is built goes unnoticed on a Linux-only run and then
        # fails, or worse silently passes, on a contributor's Windows checkout.
        shell: bash
        run: |
          cargo test -p micold-client \
            --test showcase_completeness \
            --test showcase_determinism \
            --test showcase_isolation \
            --test showcase_captions \
            --test showcase_state \
            --test showcase_glue \
            --test packaging_excludes_showcase \
            --test material_boundary \
            --test material_builder_api \
            --test idle_requests_no_frames \
            --test animated_layout_relayouts \
            --test feature_write_isolation \
            --test root_is_routing_only \
            --test root_vocabulary_is_cross_cutting \
            --test root_state_is_shared \
            --test logical_state_ownership \
            --test features_are_render_free \
            --test no_concrete_implementations \
            --test overlay_registration \
            --test feature_registration_cost \
            --test surface_registration_cost \
            --test service_capability_fakes \
            --test outcome_termination \
            --test popover_displacement \
            --test features_connection \
            --test features_help \
            --test features_notifications \
            --test features_project \
            --test features_session \
            --test features_settings \
            --test features_sidebar \
            --test features_window \
            --test features_worktree \
            --test features_worktree_form \
            --test anatomy_call_sites
      # Run the client + daemon test suites where the iced system deps are present.
      - name: Test (full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace

  # Feature 027. The sandbox adapter layer is tested on all three platforms by the `test` job
  # above, against an injected fake runner with nothing installed -- that is what keeps Principle
  # VI's coverage of it honest. This job covers the part a fake cannot: that the argv we construct
  # is accepted by a real container runtime, and that the isolation it produces is real.
  #
  # Linux-only on purpose. Docker Desktop is not available on GitHub's macOS and Windows runners,
  # so the alternative to a Linux-only job is no real-runtime job at all. The asymmetry is in test
  # *depth*, not in behaviour: nothing in the sandbox layer branches on the host platform except
  # `pathmap`, which the cross-platform job covers directly.
  sandbox-runtime:
    name: sandbox against a real runtime (linux)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Runtime version
        run: docker version --format '{{.Server.Version}}' && docker info --format '{{.Driver}}'
      # Every test behind `sandbox-real-runtime` starts from `micold-daemon:dev`, the image a
      # developer builds with `mise run image`. A runner has no such image, and the failure is not
      # a helpful one: the first test to want it dies on `No such image: micold-daemon:dev` and
      # cargo stops there, so the tests after it never run at all and the summary shows one failure
      # rather than the six targets that were skipped behind it.
      #
      # This is `mise run image` with its two host-specific parts removed. It does not go through
      # `scripts/build-lock.sh` -- the lock exists to stop several worktrees on one workstation from
      # compiling into one target directory, and a runner has neither -- and it does not
      # cross-compile, because `x86_64-unknown-linux-gnu` is already this runner's own triple. What
      # it keeps is the part that matters: the daemon binary staged beside the Containerfile, and
      # `-f`, without which docker looks for a `Dockerfile` and fails.
      - name: Build the :dev sandbox image
        run: |
          set -e
          cargo build --release -p micold-daemon
          cp target/release/micold-daemon packaging/sandbox/micold-daemon
          docker build -f packaging/sandbox/Containerfile -t micold-daemon:dev packaging/sandbox
          rm -f packaging/sandbox/micold-daemon
          # The image can build and still not run: `docker build` only proves the file was copied,
          # and whether it executes depends on the base's glibc being no older than the toolchain's.
          # That mismatch surfaces as `version GLIBC_x.yy not found` on first start, which is a
          # terrible place to find out -- so find out here. The daemon exits for its own reasons
          # (no token, no endpoint) and those are correct; only loader failures are fatal.
          smoke="$(docker run --rm --entrypoint /usr/local/bin/micold-daemon micold-daemon:dev 2>&1 | head -5 || true)"
          case "$smoke" in
            *GLIBC*|*"cannot execute"*|*"exec format error"*)
              echo "the daemon cannot execute inside micold-daemon:dev:" >&2
              echo "$smoke" >&2
              exit 1
              ;;
          esac
      # `sandbox_real_` is a *test-name* filter, not a file filter: cargo matches it against the
      # test function's path, and an integration target's name is not part of that path. So a test
      # in `tests/sandbox_real_*.rs` whose function is not also named `sandbox_real_*` runs locally
      # and is silently skipped here — no failure, just a smaller number in the summary. Every
      # real-runtime test therefore carries the prefix in its own name.
      - name: Test (real runtime)
        run: cargo test -p micold-core --features sandbox-real-runtime sandbox_real_ -- --test-threads=1

  # Constitution Principle VII: documentation ships and is verified in CI.
  # Feature 021 (FR-027): the restructuring treats the existing suite as its behavior
  # specification, which only works while the assertions are frozen.
  #
  # The job runs on every branch, but the rule it enforces does not apply to every branch: FR-027
  # binds changes made *for feature 021*, and every other feature owns its own expectations. The
  # script decides that for itself and reports without failing when out of scope (spec.md Q3).
  #
  # Blocking as of T074, and the thing that made that possible is not a lower false-positive rate
  # -- it is that a false positive can now be answered. FR-027 forbids expectations being relaxed,
  # rewritten or deleted; it cannot forbid an assertion's *spelling* changing when the thing it
  # names changes shape, and spec.md Q3 refuses to let the check guess which is which. So a removal
  # is either reinstated or adjudicated in specs/021-mvu-slice-architecture/assertion-adjudications.md,
  # under a heading naming the task and with the reason, and the check re-verifies every entry
  # against the current tree on every run: an adjudication whose assertion is no longer missing
  # fails just as loudly. Scope still applies -- out of scope this reports in full and exits 0, so
  # a concurrent feature is told what it did to the suite without being blocked.

  assertions:
    name: assertion freeze
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs history to diff against the base ref
      # The gate's own cases, before the gate runs. They existed and nothing ran them, which is how
      # a staleness rule that failed on every branch cut from main reached main: the suite is the
      # only place that mistake is cheap to catch, and it was being asked on no machine at all.
      - name: The check's own cases
        run: scripts/tests/check-assertions-frozen.test.sh
      - name: Assertions frozen since base
        env:
          # A pull request checks out a detached merge commit, so the branch name is not in the
          # repository to be read -- and it is one of the two signals scope is decided from.
          FREEZE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch --quiet origin "${{ github.base_ref || 'main' }}"
          scripts/check-assertions-frozen.sh "$BASE"

  # Deliberately unconditional (feature 023, FR-010): this is the one gate a documentation-only
  # change can actually break, so skipping the build must not skip it. No `needs: classify`, no
  # `if:`.
  docs:
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required user-guide docs exist
        run: |
          test -f docs/user-guide/help-about.md
          test -f docs/user-guide/project-selection.md
          test -f docs/user-guide/appearance-theming.md
          test -f docs/user-guide/settings.md
          test -f docs/user-guide/sandboxed-daemon.md
          test -f docs/user-guide/worktrees-and-sessions.md
          test -f docs/user-guide/icons.md
      # Principle VII for a developer-facing capability: feature 020's showcase is documented for
      # developers rather than in the user guide (its FR-024), and the doc ships in the same change.
      - name: Required developer docs exist
        run: |
          test -f docs/development/architecture.md
          test -f docs/development/component-library.md
          test -f docs/development/component-showcase.md
          # Feature 023 is developer-facing, so Principle VII is satisfied here rather than in the
          # user guide. This check runs on documentation-only changes too -- which is the point.
          test -f docs/development/ci-pipeline.md

  # The single status check the default branch's ruleset requires (feature 023). It states the
  # outcome of the run instead of enumerating the pipeline's internals, which is what lets the jobs
  # above be skipped on a documentation-only change without making a pull request unmergeable.
  # Requiring job names welds the merge gate to the pipeline's shape; requiring this one does not.
  #
  # See docs/development/ci-pipeline.md and
  # specs/023-docs-only-ci-skip/contracts/required-checks.md. Renaming this job breaks the merge
  # gate for every pull request, and no pull request can fix it -- the ruleset lives outside the
  # repository.
  ci-complete:
    name: ci complete
    needs: [classify, lint, test, sandbox-runtime, assertions, docs]
    # Load-bearing. Without it the implicit `success()` applies, so this job would be *skipped*
    # whenever a covered job failed -- and a skipped check reports success. The gate would go green
    # exactly when the run went red. `crates/micold-core/tests/ci_gate_covers_every_job.rs` asserts
    # both this and that every job above appears in `needs:`.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on every covered job
        env:
          CLASSIFY: ${{ needs.classify.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          SANDBOX: ${{ needs.sandbox-runtime.result }}
          DOCS: ${{ needs.docs.result }}
          ASSERTIONS: ${{ needs.assertions.result }}
        run: |
          status=0
          check() {
            case "$2" in
              # `skipped` is satisfied: a job that did not need to run is not a failure. That is the
              # whole point -- a documentation-only run skips lint and test, and this stays green.
              success|skipped) printf 'ok       %-12s %s\n' "$1" "$2" ;;
              *) printf 'BLOCKED  %-12s %s\n' "$1" "$2"; status=1 ;;
            esac
          }
          check classify "$CLASSIFY"
          check lint "$LINT"
          check test "$TEST"
          check sandbox "$SANDBOX"
          check docs "$DOCS"
          check assertions "$ASSERTIONS"
          {
            echo "### ci complete"
            echo
            echo "| job | result | gated |"
            echo "| --- | --- | --- |"
            echo "| classify | \`$CLASSIFY\` | yes |"
            echo "| lint | \`$LINT\` | yes |"
            echo "| test | \`$TEST\` | yes |"
            echo "| sandbox-runtime | \`$SANDBOX\` | yes |"
            echo "| docs | \`$DOCS\` | yes |"
            echo "| assertions | \`$ASSERTIONS\` | yes |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
