name: release

# Release automation:
#  1. release-please watches `main` and opens/maintains a release PR from Conventional Commits,
#     bumping the Cargo version + Cargo.lock and updating CHANGELOG.md (embedded in the app).
#  2. When that PR is merged, release-please creates a DRAFT GitHub release + tag; the `deb` job
#     builds a .deb natively on amd64 and arm64 runners and attaches them to the draft (drafts
#     are mutable, so this works even with immutable releases enabled); the `publish` job then
#     flips the draft to published, freezing it immutably with the assets attached.
#
# Why `release-please-config.json` uses `release-type: simple` and not `rust` (JSON takes no
# comments, so the reasoning lives here): the `rust` strategy assumes the manifest at the package
# path is a *package* manifest. Ours is a virtual workspace root — it has `[workspace]` but no
# `[package]` — and its members inherit `version.workspace = true`. That strategy therefore fails
# twice: it writes `package.version` into every member (there is no literal `version` to replace)
# and then into the virtual root (no `[package]` at all). `simple` makes no Cargo assumptions and
# only touches CHANGELOG.md (its `version.txt` update is skipped because the file does not exist),
# so the two `extra-files` entries do the version bump explicitly: `[workspace.package] version`
# is the single source of truth, and the three local crates' entries in Cargo.lock follow it.
# `component` is pinned because the tag prefix used to be derived from the root crate's name,
# which the workspace split removed — without it, tags would drift from `micold-ai-ide-vX.Y.Z`.
#
# Why `changelog-sections` is spelled out (same reason — JSON takes no comments): the changelog is
# `include_str!`'d into the binary and shown to users as "what's new", so the default sections are
# right for almost everything — `docs`, `chore`, `refactor`, `test` and `style` stay hidden because
# a user does not experience them. `ci` and `build` are the deliberate exception, surfaced under
# "Build & CI": feature 023 made a documentation-only change skip the pipeline entirely, which
# changes how the project is developed and released, and burying that under a hidden type meant the
# only record of it was a commit message. Specifying the list at all means specifying all of it —
# release-please replaces the defaults rather than merging with them, so every type above is listed
# explicitly, including the ones that were already hidden.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the workflow's default token is read-only; each job elevates only what it
# needs. Third-party actions are pinned to full commit SHAs (supply-chain trust) with the
# human-readable version in a trailing comment.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Opt out of the shared target directory that .cargo/config.toml sets. That directory exists to
  # stop several local agent worktrees from each keeping a ~30 GB target/ and thrashing one NVMe;
  # a runner has a single checkout, no worktrees, and a disk it throws away, so it gains nothing
  # and loses two things: cargo-deb wrote to target-shared/debian/ while the upload step globbed
  # target/debian/ (v0.5.0 failed exactly here), and Swatinem/rust-cache caches ./target, so every
  # run became a cold build. CARGO_TARGET_DIR takes precedence over `build.target-dir` in config.
  CARGO_TARGET_DIR: target

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Creates release commits/tags (contents) and maintains the release PR (pull-requests).
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deb:
    name: deb (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Only needs to upload assets to the release created by release-please.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install iced + packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      # Native build → cargo-deb derives the Debian arch (amd64 / arm64) automatically.
      - name: Build .deb
        run: cargo deb
      # release-please creates the release as a DRAFT (mutable), so assets can be attached even
      # with immutable releases enabled; the `publish` job flips it to published afterward.
      - name: Upload .deb to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" target/debian/*.deb --clobber

  publish:
    name: publish release
    needs: [release-please, deb]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Only needs to flip the draft release to published (contents), which freezes it immutably
    # with the .deb assets already attached.
    permissions:
      contents: write
    steps:
      - name: Publish the release now that the .deb assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --latest

  # The documentation site (feature 028). It is a call rather than a trigger on purpose: the job
  # above publishes the release with this workflow's own GITHUB_TOKEN, and GitHub does not start a
  # run from an event raised by GITHUB_TOKEN -- so `on: release: [published]` would fire in every
  # manual test and never on a real release. Calling the reusable workflow keeps the publication in
  # this run, where its failure is a failed job on the release itself.
  #
  # It runs after `publish` because the pages link to the release's assets and `site/stage.sh` asks
  # the release what it actually carries; a draft release answers that question differently.
  pages:
    name: publish site
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
