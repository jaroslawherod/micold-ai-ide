name: release

# Release automation:
#  1. release-please watches `main` and opens/maintains a release PR from Conventional Commits,
#     bumping the Cargo version + Cargo.lock and updating CHANGELOG.md (embedded in the app).
#  2. When that PR is merged, release-please creates a DRAFT GitHub release and its tag; the `deb` job
#     builds a .deb natively on amd64 and arm64 runners and attaches them to the draft (drafts
#     are mutable, so this works even with immutable releases enabled); the `macos` job does the
#     same for the universal .dmg, and the `windows` job for an x64 and an arm64 setup .exe; the
#     `image` jobs build and push the sandbox image for the deb architectures; the `publish` job
#     then flips the draft to published, freezing it immutably with the assets attached.
#
# Why the image is part of the *release* and not of CI (FR-024): the client ships a compiled-in
# default of `ghcr.io/jaroslawherod/micold-daemon:<its own version>`, so the reference a user's
# first sandboxed run resolves is decided at the moment this release is cut. Publishing it anywhere
# else -- on a schedule, on merge to main, by hand -- puts the two on separate clocks, and the way
# that failure shows up is a released client asking for a tag that does not exist. It shipped in
# exactly that state through 0.11.0: nothing pushed an image at all, and because the sandbox is
# opt-in, no test and no green pipeline said so.
#
# `publish` therefore waits for the image. A draft release with no image behind its version is
# recoverable -- re-run the job -- while a published one is immutable and permanently names
# something unpullable.
#
# Why `release-please-config.json` uses `release-type: simple` and not `rust` (JSON takes no
# comments, so the reasoning lives here): the `rust` strategy assumes the manifest at the package
# path is a *package* manifest. Ours is a virtual workspace root — it has `[workspace]` but no
# `[package]` — and its members inherit `version.workspace = true`. That strategy therefore fails
# twice: it writes `package.version` into every member (there is no literal `version` to replace)
# and then into the virtual root (no `[package]` at all). `simple` makes no Cargo assumptions and
# only touches CHANGELOG.md (its `version.txt` update is skipped because the file does not exist),
# so the two `extra-files` entries do the version bump explicitly: `[workspace.package] version`
# is the single source of truth, and the three local crates' entries in Cargo.lock follow it.
# `component` is pinned because the tag prefix used to be derived from the root crate's name,
# which the workspace split removed — without it, tags would drift from `micold-ai-ide-vX.Y.Z`.
#
# Why `changelog-sections` is spelled out (same reason — JSON takes no comments): the changelog is
# `include_str!`'d into the binary and shown to users as "what's new", so the default sections are
# right for almost everything — `docs`, `chore`, `refactor`, `test` and `style` stay hidden because
# a user does not experience them. `ci` and `build` are the deliberate exception, surfaced under
# "Build & CI": feature 023 made a documentation-only change skip the pipeline entirely, which
# changes how the project is developed and released, and burying that under a hidden type meant the
# only record of it was a commit message. Specifying the list at all means specifying all of it —
# release-please replaces the defaults rather than merging with them, so every type above is listed
# explicitly, including the ones that were already hidden.
#
# Why `force-tag-creation` is set (same reason): `draft: true` alone creates the release but not its
# git tag -- GitHub only creates a draft's tag when the draft is published, which here is the
# `publish` job, minutes later. The same release-please invocation that creates the release then
# builds the next release PR, looks for the release it just cut by that tag, cannot find it, and
# walks back 500 commits instead. Merging 0.13.0 and 0.13.1 each opened a release PR that way, listing
# every commit since the project began (980 and 207 of them) under a minor bump. It stayed wrong
# until an unrelated push re-ran release-please after `publish`, and merging it in that window would
# have released the whole history again. Creating the tag with the draft closes the window.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the workflow's default token is read-only; each job elevates only what it
# needs. Third-party actions are pinned to full commit SHAs (supply-chain trust) with the
# human-readable version in a trailing comment.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Opt out of the shared target directory that .cargo/config.toml sets. That directory exists to
  # stop several local agent worktrees from each keeping a ~30 GB target/ and thrashing one NVMe;
  # a runner has a single checkout, no worktrees, and a disk it throws away, so it gains nothing
  # and loses two things: cargo-deb wrote to target-shared/debian/ while the upload step globbed
  # target/debian/ (v0.5.0 failed exactly here), and Swatinem/rust-cache caches ./target, so every
  # run became a cold build. CARGO_TARGET_DIR takes precedence over `build.target-dir` in config.
  CARGO_TARGET_DIR: target

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Creates release commits/tags (contents) and maintains the release PR (pull-requests).
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deb:
    name: deb (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Only needs to upload assets to the release created by release-please.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install iced + packaging system dependencies
        run: |
          # Drop the vendor apt repositories the runner image preconfigures (Microsoft's
          # `azure-cli` and `prod`, Google Chrome) before updating. Every package installed below
          # comes from the Ubuntu archive; none has ever come from those. But `apt-get update`
          # exits 100 if *any* configured repository fails, so an outage in software this project
          # does not use fails the job -- as one did on 2026-08-27, when packages.microsoft.com
          # answered 403 for both of its repositories and the only consequence was a red build
          # that a re-run cleared.
          #
          # Emptying `sources.list.d` except for `ubuntu.sources` leaves the archive itself alone on
          # both runner generations: jammy keeps it in `/etc/apt/sources.list`, noble in
          # `sources.list.d/ubuntu.sources`. Deleting by exception rather than by `*.list` matters
          # because the vendor repositories are defined as `.list` on one image generation and as
          # deb822 `.sources` on the other. If a future image moved the archive somewhere this does
          # remove, the install below would fail immediately on a missing package rather than
          # silently install the wrong thing.
          sudo find /etc/apt/sources.list.d -mindepth 1 -not -name ubuntu.sources -delete
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      # Native build → cargo-deb derives the Debian arch (amd64 / arm64) automatically.
      - name: Build .deb
        run: cargo deb
      # release-please creates the release as a DRAFT (mutable), so assets can be attached even
      # with immutable releases enabled; the `publish` job flips it to published afterward.
      - name: Upload .deb to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" target/debian/*.deb --clobber

  # The macOS download. Same shape as `deb`: build natively, produce the artifact with the same
  # script a contributor runs locally, attach it to the still-mutable draft.
  #
  # It is a separate job rather than a leg of `deb`'s matrix because almost nothing is shared --
  # a different runner, a different toolchain step, a different producer, and the two cross-
  # compiled targets that make the download universal. A matrix whose legs share only `checkout`
  # is a matrix in name only.
  #
  # Signature verification happens inside `scripts/macos-dmg.sh`, from *inside the mounted image*
  # rather than from the directory it was built in. A failure there fails this job, which holds the
  # release (FR-037) -- exactly the outcome FR-011 wants, since a published release is immutable.
  macos:
    name: macos (universal)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    # Only needs to upload assets to the release created by release-please.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both architectures from one runner: the toolchain ships the x86_64 Apple target, and
      # cross-compiling it from Apple silicon needs no extra SDK (research R8). The two must match
      # `TARGETS` in scripts/macos-dmg.sh, which is what the merge iterates.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the shipped binaries for both architectures
        run: |
          cargo build --release -p micold-client -p micold-daemon \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      # `lipo`-merges the two builds, composes and ad-hoc signs the bundle, wraps it in the image
      # with the /Applications symlink, then mounts the result and re-verifies. No secret,
      # certificate, or Apple account is used; `mise run dmg` on a contributor's Mac produces an
      # artifact of equivalent trust (FR-016).
      - name: Build the disk image
        run: scripts/macos-dmg.sh --target-dir target --out target/macos
      - name: Upload the .dmg to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" target/macos/*.dmg --clobber

  # The Windows downloads (feature 030, FR-014; specs/030-windows-installer/contracts/release-artifacts.md).
  # Same shape as `deb`: one native leg per architecture, built with the script a contributor runs
  # locally, attached to the still-mutable draft.
  #
  # Native rather than cross-built because Inno Setup only runs on Windows and each setup installs
  # only on its own architecture (FR-015). Both runner images carry Inno Setup 6 (research R8).
  #
  # The installed package is launched before it is uploaded, by the same smoke script CI runs on every
  # change. A failure there fails this leg, which holds the release (FR-014): a published release is
  # immutable, so an installer that does not install must never reach it.
  windows:
    name: windows (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    # Only needs to upload assets to the release created by release-please.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the setup executable
        run: scripts/windows-installer.sh --arch ${{ matrix.arch }} --out-dir dist
      - name: Install, launch and uninstall it
        run: scripts/windows-install-smoke.sh dist/micold-ai-ide-*-${{ matrix.arch }}-setup.exe
      - name: Upload the setup executable to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/micold-ai-ide-*-${{ matrix.arch }}-setup.exe --clobber

  image:
    name: image (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Reads the tree; writes one package to this repository's GHCR namespace. No `contents: write`
    # -- this job attaches nothing to the release.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Two agreements to check before building anything, because both fail silently otherwise:
      # the tag release-please cut must be the version in Cargo.toml (that version is what the
      # client compiles into its default reference), and the repository this job pushes to must be
      # the one the client will ask for. A mismatch in either produces a perfectly successful
      # release that no user can pull from.
      - name: Resolve the version and check the app agrees with it
        id: ref
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#micold-ai-ide-v}"
          if [ "$version" = "$TAG_NAME" ]; then
            echo "::error::tag '$TAG_NAME' does not carry the expected 'micold-ai-ide-v' prefix" >&2
            exit 1
          fi
          # `[workspace.package] version` is the only line in the root manifest starting with
          # `version` -- dependency versions are inline inside braces.
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "::error::Cargo.toml does not carry version $version from tag $TAG_NAME" >&2
            grep -n '^version' Cargo.toml >&2 || true
            exit 1
          fi
          repo="ghcr.io/${{ github.repository_owner }}/micold-daemon"
          src=crates/micold-core/src/sandbox/image.rs
          if ! grep -q "\"$repo\"" "$src"; then
            echo "::error::$src does not name $repo, so the client will not pull what this job pushes" >&2
            grep -n 'ghcr.io' "$src" >&2 || true
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$repo:$version-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # Native, on a runner two Ubuntu releases behind the base image. The direction matters: the
      # Containerfile copies a host-built binary in, so the base's glibc has to be no *older* than
      # the toolchain's. ubuntu-22.04 links against 2.35 and trixie provides 2.41, which is the
      # safe side of that inequality -- the smoke test below is what proves it rather than assumes
      # it. Only the daemon is built here; the client's iced/X11 system dependencies are not
      # needed and are deliberately not installed.
      - name: Build the daemon for this architecture
        run: cargo build --release -p micold-daemon

      - name: Stage the daemon beside the Containerfile
        run: cp target/release/micold-daemon packaging/sandbox/micold-daemon

      # `docker login` directly rather than docker/login-action: one fewer third-party action to
      # pin and trust for a command that is a single line.
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `-f` is required: docker looks for `Dockerfile` by name and this file is a Containerfile,
      # named so podman builds it too (FR-020's runtime-agnosticism, applied to packaging).
      - name: Build the image
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          docker build \
            -f packaging/sandbox/Containerfile \
            --label "org.opencontainers.image.version=${{ steps.ref.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$REF" packaging/sandbox

      # The same check `mise run image` runs locally, for the same reason: a successful build
      # proves the binary was copied, not that it can be executed. A loader failure here would
      # otherwise reach users as `version GLIBC_x.yy not found` on their first sandboxed session.
      # The daemon exits on its own terms in this environment -- no token, no endpoint -- and that
      # is correct; only loader failures are fatal.
      - name: The daemon must be able to execute inside the image
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          smoke="$(docker run --rm --entrypoint /usr/local/bin/micold-daemon "$REF" 2>&1 | head -5 || true)"
          echo "$smoke"
          case "$smoke" in
            *GLIBC*|*"cannot execute"*|*"exec format error"*|*"no such file or directory: unknown"*)
              echo "::error::the daemon cannot execute inside $REF" >&2
              exit 1
              ;;
          esac

      # Every AI CLI the application offers has to be in the image, or picking it produces a failed
      # session instead of a refused choice (FR-023a). The Containerfile installs them; this proves
      # the layer survived into the pushed artefact, on this architecture -- npm packages with
      # native components are exactly the kind of thing that is present on amd64 and missing on
      # arm64, and a per-arch check is the only one that would notice.
      - name: The AI CLIs must be present on this architecture
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          docker run --rm --entrypoint /bin/bash "$REF" -lc \
            'command -v claude >/dev/null && command -v copilot >/dev/null'

      - name: Push
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: docker push "$REF"

  image-manifest:
    name: image (version tag)
    needs: [release-please, image]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # The per-architecture tags above exist so this step has something to point at, and they stay
      # in the registry deliberately: when a sandbox misbehaves on one architecture only, being
      # able to pull that half by name is the difference between a reproduction and a guess.
      #
      # `:<version>` -- the tag the client compiles in -- is the multi-architecture index built
      # here. `buildx imagetools create` composes it from the already-pushed manifests without
      # re-pulling either image's layers.
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Compose the multi-architecture version tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#micold-ai-ide-v}"
          repo="ghcr.io/${{ github.repository_owner }}/micold-daemon"
          docker buildx imagetools create -t "$repo:$version" \
            "$repo:$version-amd64" "$repo:$version-arm64"
          docker buildx imagetools inspect "$repo:$version"

  publish:
    name: publish release
    # Every job that attaches an artifact, with no exceptions -- a published release is immutable,
    # so a platform missing from this list is a platform whose download is missing permanently.
    # `crates/micold-core/tests/release_publishes_complete_sets.rs` reads the workflow and holds
    # this list equal to the set of jobs that run `gh release upload`.
    needs: [release-please, deb, macos, windows, image-manifest]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Only needs to flip the draft release to published (contents), which freezes it immutably
    # with every platform's assets already attached -- and to rewrite the draft's body first, which
    # is the same `contents: write` permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The first launch of the macOS download is blocked by Gatekeeper, and a user who meets that
      # block without having been told about it reads it as "this download is malware" (SC-001). So
      # the release page itself has to say what will happen, next to the file it will happen to.
      #
      # It is appended here rather than templated because release-please generates the release body
      # from the commits in the release and offers no fixed-text hook -- anything written into the
      # draft earlier is replaced when it regenerates. Appending after the draft is final and before
      # it is published is the one moment the text survives.
      #
      # `--notes-file` with the existing body prepended: `gh release edit --notes` replaces, so the
      # generated changelog is read back and rewritten with the notice on the end.
      #
      # The Windows installers are unsigned, so SmartScreen stops their first run the same way, and
      # the Windows notice (feature 030, FR-010) goes on in the same edit.
      - name: Add the macOS and Windows trust notices to the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          gh release view "$TAG_NAME" --json body --jq .body > "$body"
          for notice in .github/release-notice-macos.md .github/release-notice-windows.md; do
            [ -f "$notice" ] || { echo "missing $notice" >&2; exit 1; }
            printf '\n\n---\n\n' >> "$body"
            cat "$notice" >> "$body"
          done
          gh release edit "$TAG_NAME" --notes-file "$body"
      - name: Publish the release now that every platform's assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --latest

  # The documentation site (feature 028). It is a call rather than a trigger on purpose: the job
  # above publishes the release with this workflow's own GITHUB_TOKEN, and GitHub does not start a
  # run from an event raised by GITHUB_TOKEN -- so `on: release: [published]` would fire in every
  # manual test and never on a real release. Calling the reusable workflow keeps the publication in
  # this run, where its failure is a failed job on the release itself.
  #
  # It runs after `publish` because the pages link to the release's assets and `site/stage.sh` asks
  # the release what it actually carries; a draft release answers that question differently.
  pages:
    name: publish site
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
