name: release

# Release automation:
#  1. release-please watches `main` and opens/maintains a release PR from Conventional Commits,
#     bumping the Cargo version + Cargo.lock and updating CHANGELOG.md (embedded in the app).
#  2. When that PR is merged, release-please creates a DRAFT GitHub release + tag; the `deb` job
#     builds a .deb natively on amd64 and arm64 runners and attaches them to the draft (drafts
#     are mutable, so this works even with immutable releases enabled); the `image` jobs build and
#     push the sandbox image for the same two architectures; the `publish` job then flips the draft
#     to published, freezing it immutably with the assets attached.
#
# Why the image is part of the *release* and not of CI (FR-024): the client ships a compiled-in
# default of `ghcr.io/jaroslawherod/micold-daemon:<its own version>`, so the reference a user's
# first sandboxed run resolves is decided at the moment this release is cut. Publishing it anywhere
# else -- on a schedule, on merge to main, by hand -- puts the two on separate clocks, and the way
# that failure shows up is a released client asking for a tag that does not exist. It shipped in
# exactly that state through 0.11.0: nothing pushed an image at all, and because the sandbox is
# opt-in, no test and no green pipeline said so.
#
# `publish` therefore waits for the image. A draft release with no image behind its version is
# recoverable -- re-run the job -- while a published one is immutable and permanently names
# something unpullable.
#
# Why `release-please-config.json` uses `release-type: simple` and not `rust` (JSON takes no
# comments, so the reasoning lives here): the `rust` strategy assumes the manifest at the package
# path is a *package* manifest. Ours is a virtual workspace root — it has `[workspace]` but no
# `[package]` — and its members inherit `version.workspace = true`. That strategy therefore fails
# twice: it writes `package.version` into every member (there is no literal `version` to replace)
# and then into the virtual root (no `[package]` at all). `simple` makes no Cargo assumptions and
# only touches CHANGELOG.md (its `version.txt` update is skipped because the file does not exist),
# so the two `extra-files` entries do the version bump explicitly: `[workspace.package] version`
# is the single source of truth, and the three local crates' entries in Cargo.lock follow it.
# `component` is pinned because the tag prefix used to be derived from the root crate's name,
# which the workspace split removed — without it, tags would drift from `micold-ai-ide-vX.Y.Z`.
#
# Why `changelog-sections` is spelled out (same reason — JSON takes no comments): the changelog is
# `include_str!`'d into the binary and shown to users as "what's new", so the default sections are
# right for almost everything — `docs`, `chore`, `refactor`, `test` and `style` stay hidden because
# a user does not experience them. `ci` and `build` are the deliberate exception, surfaced under
# "Build & CI": feature 023 made a documentation-only change skip the pipeline entirely, which
# changes how the project is developed and released, and burying that under a hidden type meant the
# only record of it was a commit message. Specifying the list at all means specifying all of it —
# release-please replaces the defaults rather than merging with them, so every type above is listed
# explicitly, including the ones that were already hidden.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the workflow's default token is read-only; each job elevates only what it
# needs. Third-party actions are pinned to full commit SHAs (supply-chain trust) with the
# human-readable version in a trailing comment.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Opt out of the shared target directory that .cargo/config.toml sets. That directory exists to
  # stop several local agent worktrees from each keeping a ~30 GB target/ and thrashing one NVMe;
  # a runner has a single checkout, no worktrees, and a disk it throws away, so it gains nothing
  # and loses two things: cargo-deb wrote to target-shared/debian/ while the upload step globbed
  # target/debian/ (v0.5.0 failed exactly here), and Swatinem/rust-cache caches ./target, so every
  # run became a cold build. CARGO_TARGET_DIR takes precedence over `build.target-dir` in config.
  CARGO_TARGET_DIR: target

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Creates release commits/tags (contents) and maintains the release PR (pull-requests).
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deb:
    name: deb (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Only needs to upload assets to the release created by release-please.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install iced + packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      # Native build → cargo-deb derives the Debian arch (amd64 / arm64) automatically.
      - name: Build .deb
        run: cargo deb
      # release-please creates the release as a DRAFT (mutable), so assets can be attached even
      # with immutable releases enabled; the `publish` job flips it to published afterward.
      - name: Upload .deb to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" target/debian/*.deb --clobber

  image:
    name: image (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Reads the tree; writes one package to this repository's GHCR namespace. No `contents: write`
    # -- this job attaches nothing to the release.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Two agreements to check before building anything, because both fail silently otherwise:
      # the tag release-please cut must be the version in Cargo.toml (that version is what the
      # client compiles into its default reference), and the repository this job pushes to must be
      # the one the client will ask for. A mismatch in either produces a perfectly successful
      # release that no user can pull from.
      - name: Resolve the version and check the app agrees with it
        id: ref
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#micold-ai-ide-v}"
          if [ "$version" = "$TAG_NAME" ]; then
            echo "::error::tag '$TAG_NAME' does not carry the expected 'micold-ai-ide-v' prefix" >&2
            exit 1
          fi
          # `[workspace.package] version` is the only line in the root manifest starting with
          # `version` -- dependency versions are inline inside braces.
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "::error::Cargo.toml does not carry version $version from tag $TAG_NAME" >&2
            grep -n '^version' Cargo.toml >&2 || true
            exit 1
          fi
          repo="ghcr.io/${{ github.repository_owner }}/micold-daemon"
          src=crates/micold-core/src/sandbox/image.rs
          if ! grep -q "\"$repo\"" "$src"; then
            echo "::error::$src does not name $repo, so the client will not pull what this job pushes" >&2
            grep -n 'ghcr.io' "$src" >&2 || true
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$repo:$version-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # Native, on a runner two Ubuntu releases behind the base image. The direction matters: the
      # Containerfile copies a host-built binary in, so the base's glibc has to be no *older* than
      # the toolchain's. ubuntu-22.04 links against 2.35 and trixie provides 2.41, which is the
      # safe side of that inequality -- the smoke test below is what proves it rather than assumes
      # it. Only the daemon is built here; the client's iced/X11 system dependencies are not
      # needed and are deliberately not installed.
      - name: Build the daemon for this architecture
        run: cargo build --release -p micold-daemon

      - name: Stage the daemon beside the Containerfile
        run: cp target/release/micold-daemon packaging/sandbox/micold-daemon

      # `docker login` directly rather than docker/login-action: one fewer third-party action to
      # pin and trust for a command that is a single line.
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `-f` is required: docker looks for `Dockerfile` by name and this file is a Containerfile,
      # named so podman builds it too (FR-020's runtime-agnosticism, applied to packaging).
      - name: Build the image
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          docker build \
            -f packaging/sandbox/Containerfile \
            --label "org.opencontainers.image.version=${{ steps.ref.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$REF" packaging/sandbox

      # The same check `mise run image` runs locally, for the same reason: a successful build
      # proves the binary was copied, not that it can be executed. A loader failure here would
      # otherwise reach users as `version GLIBC_x.yy not found` on their first sandboxed session.
      # The daemon exits on its own terms in this environment -- no token, no endpoint -- and that
      # is correct; only loader failures are fatal.
      - name: The daemon must be able to execute inside the image
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          smoke="$(docker run --rm --entrypoint /usr/local/bin/micold-daemon "$REF" 2>&1 | head -5 || true)"
          echo "$smoke"
          case "$smoke" in
            *GLIBC*|*"cannot execute"*|*"exec format error"*|*"no such file or directory: unknown"*)
              echo "::error::the daemon cannot execute inside $REF" >&2
              exit 1
              ;;
          esac

      # Every AI CLI the application offers has to be in the image, or picking it produces a failed
      # session instead of a refused choice (FR-023a). The Containerfile installs them; this proves
      # the layer survived into the pushed artefact, on this architecture -- npm packages with
      # native components are exactly the kind of thing that is present on amd64 and missing on
      # arm64, and a per-arch check is the only one that would notice.
      - name: The AI CLIs must be present on this architecture
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          docker run --rm --entrypoint /bin/bash "$REF" -lc \
            'command -v claude >/dev/null && command -v copilot >/dev/null'

      - name: Push
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: docker push "$REF"

  image-manifest:
    name: image (version tag)
    needs: [release-please, image]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # The per-architecture tags above exist so this step has something to point at, and they stay
      # in the registry deliberately: when a sandbox misbehaves on one architecture only, being
      # able to pull that half by name is the difference between a reproduction and a guess.
      #
      # `:<version>` -- the tag the client compiles in -- is the multi-architecture index built
      # here. `buildx imagetools create` composes it from the already-pushed manifests without
      # re-pulling either image's layers.
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Compose the multi-architecture version tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#micold-ai-ide-v}"
          repo="ghcr.io/${{ github.repository_owner }}/micold-daemon"
          docker buildx imagetools create -t "$repo:$version" \
            "$repo:$version-amd64" "$repo:$version-arm64"
          docker buildx imagetools inspect "$repo:$version"

  publish:
    name: publish release
    needs: [release-please, deb, image-manifest]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Only needs to flip the draft release to published (contents), which freezes it immutably
    # with the .deb assets already attached.
    permissions:
      contents: write
    steps:
      - name: Publish the release now that the .deb assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --latest
