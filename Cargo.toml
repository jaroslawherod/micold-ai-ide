[workspace]
resolver = "2"
members = [
    "crates/micold-core",
    "crates/micold-daemon",
    "crates/micold-e2e",
]

# Shared package metadata — the single source of truth for version/edition/MSRV across
# all three crates (feature 010, plan Decision 3: workspace split enforces the render-free
# boundary at compile time — `micold-core` cannot name iced or a PTY type).
# Version follows main's release train (0.4.0 from release-please, merged in).
[workspace.package]
version = "0.18.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jaroslawherod/micold-ai-ide"
# MSRV pinned to the latest stable toolchain (plan Decision 1). `std::fs::File::lock`
# (stable since 1.89) replaces the former `fd-lock` dependency for the daemon singleton.
rust-version = "1.97"

# Shared dependency versions. Crates opt in with `dep = { workspace = true }`, so a version
# is declared in exactly one place.
[workspace.dependencies]
# Feature 533 (research R2): the Jira Cloud request. rustls on the `ring` backend (no C/NASM toolchain), the OS certificate store, JSON off.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
base64 = "0.23"

# --- render-free core deps (never iced / never PTY) ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
# Grapheme clusters for a session label's 80-character cut (feature 032, FR-003, research R8).
# Already in Cargo.lock through iced/cosmic-text; dependency-free, MIT/Apache-2.0.
unicode-segmentation = "1.13"
# Feature 940 (research R1): the markdown model in core. CommonMark + GFM tables, strikethrough and
# task lists; default features off, so it adds `unicase` only (MIT; `memchr`, `bitflags` already in).
pulldown-cmark = { version = "0.13", default-features = false }
# Feature 940 (research R6): line diffs of Edit, MultiEdit and Write tool calls in core. Myers with
# a deadline; dependency-free, Apache-2.0.
similar = "3"
# Feature 1271 (research R1): a file's change id is the SHA-1 of its change record. Already in
# `Cargo.lock` (0.10.7, RustCrypto, MIT OR Apache-2.0), so it adds no crate.
sha1 = "0.10"
# #1948: the SHA-256 of a token (`orchestrator::auth::hash_of`), same RustCrypto family as sha1.
sha2 = "0.10"
directories = "6.0.0"
# Wire encoding for the client<->daemon protocol (plan W1): compact grid frames.
postcard = { version = "1.1", features = ["use-std"] }
# `kill(2)`/`process_group` for the environment-include script timeout (feature 011) and
# `geteuid`/`setsid` for the daemon endpoint + detached spawn — one pin for both.
libc = "0.2.189"
# --- transport / async (daemon; the client already has tokio via iced) — plan W1 ---
# The shared framing codec lives in micold-core; the runtime + IPC live in the daemon/client.
tokio = { version = "1.53", features = [
    "io-std",
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "sync",
    "time",
    "signal",
    # Child stdio for the `ssh` transport (feature 489): the system `ssh` is a spawned child.
    "process",
    # A drop on a structured pane reads its pictures off the UI thread (feature 941, R11).
    "fs",
] }
tokio-util = { version = "0.7.19", features = ["codec"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
bytes = "1"
# Cross-platform filesystem change notification, for tailing a Copilot session's `events.jsonl`
# (feature 026, FR-019). Vetted in `specs/026-multi-provider-sessions/research.md` R14.
notify = "8.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
futures-util = { version = "0.3", features = ["sink"] }
# --- terminal stack (client today; migrates into micold-daemon at T030) ---
portable-pty = "0.9"
alacritty_terminal = "0.26"
# Feature 1521: the daemon configuration file (`daemon.toml`); spans give `file:line:col` errors.
toml = "1.1.6"
# --- shared dev deps ---
tempfile = "3.27.0"
# Internal crate, referenced by path so client & daemon share the one core.
micold-core = { path = "crates/micold-core" }

[workspace.lints.clippy]
all = "warn"

# Debug builds default to `debug = 2` (full DWARF), which is the bulk of the bytes
# cargo writes: a `cargo test --workspace` link phase measured 260 MB/s sustained --
# enough to fill the kernel's dirty page pool and stall every other process on the
# machine, and enough to grow target-shared/debug to 84 GB. "line-tables-only" keeps
# backtraces with function names and line numbers -- what a panic or a failing test
# actually needs -- and drops the variable and type DWARF that only a debugger reads.
# Recover it ad hoc with `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = "line-tables-only"

# `cargo test` compiles test targets under [profile.test]; their dependencies build
# under [profile.dev] above. Both need the setting for the reduction to apply to a
# whole `cargo test --workspace` run.
[profile.test]
debug = "line-tables-only"

# `incremental = false` (equivalently `CARGO_INCREMENTAL=0`) was evaluated for the gate and
# agent builds (issue #1634) on the theory that the incremental cache -- rewritten on every
# edit -- is most of the IO-bound write volume. Measured on micold-core (the workspace's own
# crate, so every other crate rebuilds on it too): an edit-rebuild cycle with incremental on
# took 20-21 s and wrote 0.2-1.2 GB; the same cycle with it off took 57-74 s and wrote
# 1.2-6.1 GB -- slower *and* heavier, because disabling it forces full LLVM codegen of the
# touched crate (and a relink of every dependent test binary) on every edit, instead of
# reusing the unchanged codegen units. It stays on.

# The stop-time and start-time terminal history work walks every cell of 10,000-line terminals
# (feature 041: capture and seed). Unoptimised, ten of them take longer than the 3 s stop bound on
# a two-core CI runner (`ten_busy_sessions_are_all_saved_within_the_bound`, 4.5 s on macOS and
# Linux), which says nothing about the release build the bound is for. These two crates are
# optimised in debug and test builds so the tests measure the bound, not the compiler's settings.
[profile.dev.package.micold-daemon]
opt-level = 1
[profile.dev.package.alacritty_terminal]
opt-level = 2
