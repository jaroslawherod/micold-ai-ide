[workspace]
resolver = "2"
members = ["crates/micold-core", "crates/micold-daemon", "crates/micold-client"]

# Shared package metadata — the single source of truth for version/edition/MSRV across
# all three crates (feature 010, plan Decision 3: workspace split enforces the render-free
# boundary at compile time — `micold-core` cannot name iced or a PTY type).
[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Cumulocity-IoT/micold-ai-ide"
# MSRV pinned to the latest stable toolchain (plan Decision 1). `std::fs::File::lock`
# (stable since 1.89) replaces the former `fd-lock` dependency for the daemon singleton.
rust-version = "1.97"

# Shared dependency versions. Crates opt in with `dep = { workspace = true }`, so a version
# is declared in exactly one place.
[workspace.dependencies]
# --- render-free core deps (never iced / never PTY) ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
directories = "6.0.0"
# Wire encoding for the client<->daemon protocol (plan W1): compact grid frames.
postcard = { version = "1.1", features = ["use-std"] }
# `kill(2)`/`process_group` for the environment-include script timeout (feature 011).
libc = "0.2.186"
# --- client (iced) deps ---
iced = { version = "0.13", features = ["tokio", "canvas", "advanced", "lazy"] }
dark-light = "2.0"
# --- terminal stack (client today; migrates into micold-daemon at T030) ---
portable-pty = "0.9"
alacritty_terminal = "0.25"
# --- shared dev deps ---
tempfile = "3.27.0"
ttf-parser = "0.21"
# Internal crate, referenced by path so client & daemon share the one core.
micold-core = { path = "crates/micold-core" }

[workspace.lints.clippy]
all = "warn"
