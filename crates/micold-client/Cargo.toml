[package]
name = "micold-client"
description = "Thin iced client for Micold AI IDE (feature 010): renders daemon-hosted sessions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# With two binaries, `cargo run -p micold-client` would otherwise be ambiguous — and that command is
# `mise run run`, the documented way to launch the application. The showcase (feature 020) is a
# development tool; the application stays the default (research R1a).
default-run = "micold-ai-ide"

# The iced library layer (app state/update, keymap, icons, tokens, motion, ui widgets),
# exposed so integration tests can drive it (`micold_client::app`, `micold_client::ui`).
[lib]
name = "micold_client"
path = "src/lib.rs"

# The GUI binary. Name preserved as `micold-ai-ide` (installed launcher entry, deb package).
[[bin]]
name = "micold-ai-ide"
path = "src/main.rs"

# The component showcase (feature 020): a development-only gallery of every shared component, in
# every posed state, in both schemes, on one page. Runs with no daemon, no git repository and no
# saved state. Deliberately absent from `[package.metadata.deb] assets` below and from the desktop
# entry — it must never reach an end user (FR-018), which `tests/packaging_excludes_showcase.rs`
# enforces rather than trusting anyone to remember.
[[bin]]
name = "micold-showcase"
path = "src/showcase/main.rs"

[dependencies]
micold-core = { workspace = true }
iced = { workspace = true }
dark-light = { workspace = true }
# The client no longer hosts a PTY (sessions live in micold-daemon); it keeps `alacritty_terminal`
# only for the VT-mode/flag/colour *types* its grid-cache renderer resolves against.
alacritty_terminal = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Timer for the connection keepalive (US5, FR-026). The client already runs on tokio via iced's
# tokio executor; this makes the dependency explicit rather than transitive.
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ttf-parser = { workspace = true }

[lints]
workspace = true

# Debian packaging (`cargo deb -p micold-client`). Asset source paths are relative to the
# workspace root; the release workflow invokes cargo-deb from there. (Packaging verification
# tracked separately — not part of the Phase 1 workspace-split checkpoint.)
[package.metadata.deb]
maintainer = "Jaroslaw Herod <jaroslaw.herod@cumulocity.com>"
copyright = "2026, Micold AI IDE contributors"
extended-description = "A local-first, AI-assisted desktop IDE for managing Claude Code worktrees and sessions with an embedded terminal."
section = "devel"
priority = "optional"
depends = "$auto, desktop-file-utils, hicolor-icon-theme"
assets = [
    ["target/release/micold-ai-ide", "usr/bin/", "755"],
    # The session daemon binary the client auto-spawns / the systemd user unit launches (feature 010).
    ["target/release/micold-daemon", "usr/bin/", "755"],
    # systemd *user* units — shipped, NOT enabled at install; the client enables them in-session on
    # request (US7, FR-038, research R5.1). Path is /usr/lib/systemd/user/ (merged-/usr Debian),
    # never /etc/systemd/user/ (admin config).
    # Asset source paths are resolved by cargo-deb relative to THIS crate's manifest dir, so the
    # workspace-root files need `../../` (the `target/` binaries above are resolved via the shared
    # target dir and stay bare).
    ["../../packaging/micold-daemon.socket", "usr/lib/systemd/user/micold-daemon.socket", "644"],
    ["../../packaging/micold-daemon.service", "usr/lib/systemd/user/micold-daemon.service", "644"],
    ["../../packaging/micold-ai-ide.desktop", "usr/share/applications/micold-ai-ide.desktop", "644"],
    ["../../assets/icon/png/icon-16.png", "usr/share/icons/hicolor/16x16/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/png/icon-32.png", "usr/share/icons/hicolor/32x32/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/png/icon-48.png", "usr/share/icons/hicolor/48x48/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/png/icon-64.png", "usr/share/icons/hicolor/64x64/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/png/icon-128.png", "usr/share/icons/hicolor/128x128/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/png/icon-256.png", "usr/share/icons/hicolor/256x256/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/png/icon-512.png", "usr/share/icons/hicolor/512x512/apps/micold-ai-ide.png", "644"],
    ["../../assets/icon/icon.svg", "usr/share/icons/hicolor/scalable/apps/micold-ai-ide.svg", "644"],
    ["../../README.md", "usr/share/doc/micold-ai-ide/README.md", "644"],
]
