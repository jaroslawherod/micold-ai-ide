# Written by Micold AI IDE from Settings. Edit the daemon in Settings: a change made here is overwritten.
schema = 1

[daemon]
name = "Sandbox"
kind = "container"
image = "ghcr.io/acme/micold:1"
idle_stop = "default"

[listen]
tcp = "0.0.0.0:7000"

[auth]
client_token_file = "/run/micold/secrets/client-token"

[ssh]
dir = "/run/micold/ssh"

[storage]
clone_root = "/workspace"
