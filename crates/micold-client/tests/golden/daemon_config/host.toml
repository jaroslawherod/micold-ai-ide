# Written by Micold AI IDE from Settings. Edit the daemon in Settings: a change made here is overwritten.
schema = 1

[daemon]
name = "Host"
kind = "host"
data_dir = "/home/me/.local/share/micold-ai-ide"
time_zone = "Europe/Warsaw"
idle_stop = "default"
log = "info"

[listen]
socket = "auto"

[storage]
clone_root = "/home/me/src"

[[projects]]
path = "/home/me/src/app"
remote = "https://github.com/acme/app.git"
