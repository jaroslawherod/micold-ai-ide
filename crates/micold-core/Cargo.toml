[package]
autotests = false
name = "micold-core"
description = "Render-free shared domain model for Micold AI IDE (state, persistence, session/worktree logic, wire protocol)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "micold_core"
path = "src/lib.rs"

# FR-040 enforcement: this crate declares ONLY render-free dependencies. It has no line
# for `iced`, `dark-light`, `portable-pty`, or `alacritty_terminal` — so a render or PTY
# type cannot be named here without a compile error, not merely a convention.
[features]
# Feature 027. Opts in to the tests that drive a **real** container runtime rather than the
# injected fake. Off by default so `cargo test --workspace` needs nothing installed on any
# platform, which is the property that keeps the adapter layer's cross-platform coverage honest
# (Principle VI). The `sandbox-runtime` CI job turns it on, on Linux only.
sandbox-real-runtime = []
# Feature 489: the stale-daemon fixture suffix is honoured only under this feature (research R10).
ssh-real-runtime = []
# Feature 686: exposes `kube::fake::FakeCluster` to client tests.
kube-fake = []
# #1537: the retired `MICOLD_DATA_DIR` is read only with this feature, which the crate's own tests
# turn on (a dev-dependency on itself) and the daemon's `test-env` forwards.
test-env = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# Feature 032: count a first-turn label in user-perceived characters (FR-003).
unicode-segmentation = { workspace = true }
# Feature 940: assistant and thinking text parsed into the markdown model (research R1).
pulldown-cmark = { workspace = true }
# Feature 940: Edit, MultiEdit and Write tool inputs as line diffs (research R6).
similar = { workspace = true }
# Feature 1271: the digest of a file's change record (`review::marks::ChangeId`, research R1).
sha1 = { workspace = true }
directories = { workspace = true }
postcard = { workspace = true }
# Shared client<->daemon framing codec (protocol::codec). `tokio-util`'s `LengthDelimitedCodec`
# plus `bytes` — NOT iced and NOT a PTY crate, so FR-040 is intact. Both binaries reuse this one
# codec so framing can never drift between them.
tokio-util = { workspace = true }
bytes = { workspace = true }
# Endpoint location, detached daemon spawn, and the client-side connect/handshake all live here so
# BOTH binaries compile against one definition — a client and daemon can never disagree about where
# the socket is or how the handshake goes. Still no iced and no PTY crate (FR-040).
tokio = { workspace = true }
interprocess = { workspace = true }
futures-util = { workspace = true }
# Feature 941: image blocks of a user message carry the picture in base64 (research R8).
base64 = { workspace = true }
# Feature 1521: the daemon configuration file (`daemon_config`).
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `geteuid`/`setsid` for endpoint ownership verification + detached spawn, and
# `kill(2)`/`process_group` for the environment-include script timeout (`env_include`).
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Job Objects for the environment-include script timeout — the Windows counterpart to the process
# group `libc` provides above (BUG-003). Still render-free, so FR-040 is intact.
windows-sys = { workspace = true }

[dev-dependencies]
micold-core = { path = ".", features = ["test-env"] }
tempfile = { workspace = true }
# Feature 686: phase bounds are tested on a paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# Integration tests (#1631): `tests/main.rs` links every ordinary test file as a module; the targets below stay
# separate (process-global state, timing budgets, container or sshd runtimes). A new file under `tests/` must be a
# `mod` of `tests/main.rs` or be listed here; `every_test_file_is_wired` checks it.

