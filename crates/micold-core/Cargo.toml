[package]
name = "micold-core"
description = "Render-free shared domain model for Micold AI IDE (state, persistence, session/worktree logic, wire protocol)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "micold_core"
path = "src/lib.rs"

# FR-040 enforcement: this crate declares ONLY render-free dependencies. It has no line
# for `iced`, `dark-light`, `portable-pty`, or `alacritty_terminal` — so a render or PTY
# type cannot be named here without a compile error, not merely a convention.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
postcard = { workspace = true }
# Shared client<->daemon framing codec (protocol::codec). `tokio-util`'s `LengthDelimitedCodec`
# plus `bytes` — NOT iced and NOT a PTY crate, so FR-040 is intact. Both binaries reuse this one
# codec so framing can never drift between them.
tokio-util = { workspace = true }
bytes = { workspace = true }
# Endpoint location, detached daemon spawn, and the client-side connect/handshake all live here so
# BOTH binaries compile against one definition — a client and daemon can never disagree about where
# the socket is or how the handshake goes. Still no iced and no PTY crate (FR-040).
tokio = { workspace = true }
interprocess = { workspace = true }
futures-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `geteuid`/`setsid` for endpoint ownership verification + detached spawn, and
# `kill(2)`/`process_group` for the environment-include script timeout (`env_include`).
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Job Objects for the environment-include script timeout — the Windows counterpart to the process
# group `libc` provides above (BUG-003). Still render-free, so FR-040 is intact.
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
