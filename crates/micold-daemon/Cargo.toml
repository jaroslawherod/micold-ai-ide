[package]
autotests = false
name = "micold-daemon"
description = "User-space session host for Micold AI IDE (feature 010): owns PTY/VT sessions that outlive the UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "micold_daemon"
path = "src/lib.rs"

[[bin]]
name = "micold-daemon"
path = "src/main.rs"

# Mirrors `micold-core`'s gate (Principle VI): the default suite must need no container runtime
# installed on any platform, or the adapter layer's cross-platform coverage stops meaning anything.
# The one target behind this feature measures the two placements against each other, which needs
# both the real daemon binary Cargo builds and a real Docker daemon.
[features]
default = []
sandbox-real-runtime = []
# Feature 489: the `ssh_real_*` suite against a rootless `sshd` (off by default; `mise run test-ssh`).
ssh-real-runtime = ["micold-core/ssh-real-runtime"]
# #1537: the retired `MICOLD_*` start-up variables (`micold_core::retired_env`) are read only with
# this feature, which the daemon's own tests turn on (a dev-dependency on itself), so a release
# build ignores them and warns.
test-env = ["micold-core/test-env"]

[dependencies]
micold-core = { workspace = true }
# Transport + runtime (plan W1, tasks T015-T020).
tokio = { workspace = true }
tokio-util = { workspace = true }
interprocess = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reach discovery for the credential helper (#1530, research D6): the daemon asks GitHub which
# repositories each token can see. Same workspace version the client uses.
ureq = { workspace = true }
futures-util = { workspace = true }
# Per-session hook tokens + session-uuid path parsing for the loopback activity receiver (US2, T045).
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
# Filesystem change notification for `ActivitySource::EventLog` sessions (feature 026, FR-019):
# a Copilot session's busy/idle signal is the tail of its own `events.jsonl`, and FR-019 forbids a
# polling timer of ours. One vetted abstraction instead of three platform backends (research R14).
notify = { workspace = true }
# PTY/VT stack (plan W3, tasks T030/T031): the daemon now owns every `Term` and PTY child so
# sessions outlive the UI. `alacritty_terminal` interprets VT/ANSI into a grid; `portable-pty`
# hosts the child process. Stable `LineId` diffing (T006/T032) rides on top via a trait, so the
# vendored fork (plan Decision 2) stays a swappable fallback for the approximation used today.
alacritty_terminal = { workspace = true }
portable-pty = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Ownership/mode verification for the `/tmp` endpoint fallback (protocol.md §1, FR-030).
libc = { workspace = true }

# The pipe's protected DACL and the per-session job object that reaps a session's process tree
# (`src/platform/windows.rs`, feature 030, research R2, R6, FR-036). `tests/windows_process_tree.rs`
# and `tests/windows_pipe_acl.rs` use it too, through this normal dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# Turns `test-env` on for the daemon's own tests, the spawned binary included.
micold-daemon = { path = ".", features = ["test-env"] }
# `sandbox_real_no_user_credentials.rs` builds its host with `sandbox::hostile_host` (#1002).
micold-core = { workspace = true, features = ["kube-fake"] }
tempfile = { workspace = true }
# `mcp_confirmations.rs` runs the 60 s confirmation wait on tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
# `hooks_receiver.rs` builds realistically-shaped hook payloads rather than hand-rolled JSON strings.
serde_json = { workspace = true }
# Integration tests drive real PTY sessions and read the interpreted grid directly.
alacritty_terminal = { workspace = true }
portable-pty = { workspace = true }
# `client_restart_input.rs` drives the real daemon binary from the real client-side input stamper,
# so the client-restart boundary is exercised with both ends' actual code rather than a stand-in.
# Not a cycle: `micold-client` depends only on `micold-core`, never on the daemon.
micold-client = { path = "../micold-client" }

[build-dependencies]
# The exe icon on Windows (feature 030, FR-003); see `build.rs`.
embed-resource = { workspace = true }

[lints]
workspace = true

# Integration tests (#1631): `tests/main.rs` links every ordinary test file as a module; the targets below stay
# separate (process-global state, timing budgets, container or sshd runtimes). A new file under `tests/` must be a
# `mod` of `tests/main.rs` or be listed here; `every_test_file_is_wired` checks it.

[[test]]
name = "orchestrator"
path = "tests/orchestrator/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

# #1537: installs the process-wide settings (one `OnceLock` per process), so a target of its own.
