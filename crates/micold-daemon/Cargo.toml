[package]
name = "micold-daemon"
description = "User-space session host for Micold AI IDE (feature 010): owns PTY/VT sessions that outlive the UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "micold_daemon"
path = "src/lib.rs"

[[bin]]
name = "micold-daemon"
path = "src/main.rs"

# Mirrors `micold-core`'s gate (Principle VI): the default suite must need no container runtime
# installed on any platform, or the adapter layer's cross-platform coverage stops meaning anything.
# The one target behind this feature measures the two placements against each other, which needs
# both the real daemon binary Cargo builds and a real Docker daemon.
[features]
default = []
sandbox-real-runtime = []

[dependencies]
micold-core = { workspace = true }
# Transport + runtime (plan W1, tasks T015-T020).
tokio = { workspace = true }
tokio-util = { workspace = true }
interprocess = { workspace = true }
bytes = { workspace = true }
listenfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
# Per-session hook tokens + session-uuid path parsing for the loopback activity receiver (US2, T045).
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
file-rotate = { workspace = true }
directories = { workspace = true }
# Filesystem change notification for `ActivitySource::EventLog` sessions (feature 026, FR-019):
# a Copilot session's busy/idle signal is the tail of its own `events.jsonl`, and FR-019 forbids a
# polling timer of ours. One vetted abstraction instead of three platform backends (research R14).
notify = { workspace = true }
# PTY/VT stack (plan W3, tasks T030/T031): the daemon now owns every `Term` and PTY child so
# sessions outlive the UI. `alacritty_terminal` interprets VT/ANSI into a grid; `portable-pty`
# hosts the child process. Stable `LineId` diffing (T006/T032) rides on top via a trait, so the
# vendored fork (plan Decision 2) stays a swappable fallback for the approximation used today.
alacritty_terminal = { workspace = true }
portable-pty = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Ownership/mode verification for the `/tmp` endpoint fallback (protocol.md §1, FR-030).
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
uuid = { workspace = true }
# `hooks_receiver.rs` builds realistically-shaped hook payloads rather than hand-rolled JSON strings.
serde_json = { workspace = true }
# Integration tests drive real PTY sessions and read the interpreted grid directly.
alacritty_terminal = { workspace = true }
portable-pty = { workspace = true }
# `client_restart_input.rs` drives the real daemon binary from the real client-side input stamper,
# so the client-restart boundary is exercised with both ends' actual code rather than a stand-in.
# Not a cycle: `micold-client` depends only on `micold-core`, never on the daemon.
micold-client = { path = "../micold-client" }

[lints]
workspace = true
