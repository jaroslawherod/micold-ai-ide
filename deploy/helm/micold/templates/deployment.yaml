{{- include "micold.stateMode" . -}}
{{- /*
The orchestrator. One replica, recreated rather than rolled: two pods would both own the registry
file on the volume. Fixed paths (FR-019): data /var/lib/micold, socket /run/micold/orchestrator.sock
(an emptyDir the M4 test daemon shares), /tmp an emptyDir under the read-only root.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "micold.fullname" . }}-orchestrator
  labels:
    {{- include "micold.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "micold.selectorLabels" (list . "orchestrator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "micold.labels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "micold.podSecurityContext" . | nindent 8 }}
      containers:
        - name: orchestrator
          image: {{ include "micold.image" (list . .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/micold-daemon"]
          args:
            - orchestrator
            - --data-dir=/var/lib/micold
            - --socket=/run/micold/orchestrator.sock
          securityContext:
            {{- include "micold.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/micold
            - name: run
              mountPath: /run/micold
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.state.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "micold.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
