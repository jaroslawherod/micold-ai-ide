# Values for the micold chart. Contract: specs/1981-kube-e2e/contracts/chart-values.md. The names
# under `image`, `state` and `database` are the ones specs/1722-rn-client-k8s/plan.md fixes, so
# #1740 extends this chart; scripts/tests/chart-conformance.test.sh fails when one drifts.

image:
  # The orchestrator image: the `micold-daemon` binary on distroless cc, UID 65532
  # (Dockerfile.orchestrator).
  repository: ghcr.io/jaroslawherod/micold-orchestrator
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

state:
  # Where the orchestrator keeps its registry: `file`, a JSON registry under the data directory, or
  # `postgres`, the #1948 store (needs `postgres.enabled` or `database.existingSecret`). Any other
  # value, `sqlite` included, fails to render.
  mode: file
  persistence:
    # true: a PersistentVolumeClaim at the data directory, so the registry survives a restart.
    # false: an emptyDir, which loses it with the pod.
    enabled: true
    size: 1Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""

database:
  # state.mode=postgres: a Secret whose `url` key holds the database URL. Empty uses the chart's
  # own Postgres (postgres.enabled). Unused by `state.mode=file`.
  existingSecret: ""

postgres:
  # true: a single-instance Postgres StatefulSet for state.mode=postgres (#1732 M5, local kind stack).
  enabled: false
  image: docker.io/library/postgres:18.7-alpine3.24@sha256:fa1b61f5a4844f4d4b73c9b15716cfc75fe70c931f2d32723630f3b900056366
  size: 1Gi
  storageClass: ""

orchestrator:
  api:
    # true: the client API (/api/ws, #1732) on the pod's loopback, reached by `kubectl port-forward`.
    enabled: false
    port: 8730
  # Origins allowed to open /api/ws: one `--allow-origin` each.
  allowOrigins: []

daemons:
  # Seeded daemons run as sidecars of the orchestrator pod, dialling its socket (#1732 M5, FR-021).
  count: 0
  # sh and git for files/seed-catalog.sh.
  seedImage: docker.io/alpine/git:v2.54.1@sha256:f662909590ca05cad0928f1ff3957043b3cfd9e880af05a6318206e5a0a00f14

ops:
  # The orchestrator's ops listener: `--ops-addr=0.0.0.0:<port>`, a Service on that port and the
  # startup, readiness (/readyz) and liveness (/healthz) probes. false renders none of them.
  enabled: true
  port: 9090

web:
  # The web UI. Off by default; when off the chart renders no web resource at all.
  enabled: false
  image:
    repository: ghcr.io/jaroslawherod/micold-web
    tag: ""
    pullPolicy: IfNotPresent
  # The port the web container listens on, and the Service's port in front of it.
  containerPort: 8080
  service:
    port: 80

# Requests and limits for the orchestrator container.
resources: {}

# Test support (#1981/#1985); set only by ci/*.yaml and the e2e harness, never in production.
testDaemon:
  # true: a second container in the orchestrator pod, the same image running
  # `micold-daemon e2e-link idle`, sharing /run/micold so the suites can `kubectl exec` link
  # verbs against the orchestrator's socket (ci/e2e.yaml).
  enabled: false

testing:
  corruptRegistry:
    # true: a digest-pinned busybox init container writes an invalid orchestrator/registry.json
    # into the data volume, so the pod must refuse to start (ci/corrupt-registry.yaml).
    enabled: false
  # One deliberately wrong manifest for the harness's seeded-breakage matrix (SC-003), set with
  # `--set testing.breakage=<v>`: none | command | user | volume | dataDir | opsPort.
  breakage: none

