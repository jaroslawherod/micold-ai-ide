[tools]
rust = "stable"
uv = "latest"

# Every cargo task below goes through scripts/build-lock.sh, which points cargo
# at one shared target directory beside the main checkout instead of a ~30 GB
# target/ per worktree.
#
# The batch tasks additionally take a lock in the shared git dir, so only one of
# them compiles at a time *across every worktree*. `jobs = 4` in
# .cargo/config.toml only caps a single cargo process; four worktrees building
# at once still means sixteen jobs, which oversubscribes RAM and stalls the
# machine on swap I/O. Set MICOLD_NO_BUILD_LOCK=1 to bypass the lock for a
# one-off run.
#
# The interactive tasks below pass --no-lock: they share the target directory,
# but stay in the foreground for as long as you use the app, and holding the
# build lock for that whole time would block every other worktree.

[tasks.run]
description = "Run the GUI client (feature 010: spawns/attaches the session daemon)"
run = "{{config_root}}/scripts/build-lock.sh --no-lock cargo run -p micold-client"

[tasks.showcase]
description = "Run the component showcase (feature 020): every shared component on one page"
run = "{{config_root}}/scripts/build-lock.sh --no-lock cargo run -p micold-client --bin micold-showcase"

[tasks.daemon]
description = "Run the session daemon directly (normally auto-spawned by the client)"
run = "{{config_root}}/scripts/build-lock.sh --no-lock cargo run -p micold-daemon"

[tasks.screenshot]
description = "Capture the desktop to a PNG, for the manual visual passes (quickstart Part B)"
run = "scripts/screenshot-session.py"

[tasks.fixture]
description = "Build the 20-worktree reference scene for the frame-time measurement (018 §B8)"
run = "scripts/reference-scene.sh"

[tasks.test]
description = "Test the whole workspace (core + client + daemon), matching CI [build-locked]"
run = "{{config_root}}/scripts/build-lock.sh cargo test --workspace"

[tasks.test-core]
description = "Test the render-free core only (fast, no GUI / no iced) [build-locked]"
run = "{{config_root}}/scripts/build-lock.sh cargo test -p micold-core --all-targets"

[tasks.build]
description = "Build the release GUI binary [build-locked]"
run = "{{config_root}}/scripts/build-lock.sh cargo build --release -p micold-client"

[tasks.image]
description = "Build the :dev sandbox image from the working tree (feature 027, FR-024c) [build-locked]"
run = """
# The development loop the sandbox has to support. Without it, sandboxed mode would be testable
# only by whoever can publish a release image -- so the people who build this feature could not
# run it, and the failure would not surface until after release (FR-024c).
set -e

runtime="${MICOLD_RUNTIME:-docker}"
command -v "$runtime" >/dev/null 2>&1 || { echo "image: $runtime is not installed" >&2; exit 1; }

# The daemon inside the image is a Linux binary regardless of the host, because the sandbox is a
# Linux container on all three platforms (Docker Desktop's VM on macOS and Windows).
target="${MICOLD_IMAGE_TARGET:-x86_64-unknown-linux-gnu}"
{{config_root}}/scripts/build-lock.sh cargo build --release -p micold-daemon --target "$target"

out="$({{config_root}}/scripts/build-lock.sh --print-target-dir)/$target/release/micold-daemon"
cp "$out" {{config_root}}/packaging/sandbox/micold-daemon
trap 'rm -f {{config_root}}/packaging/sandbox/micold-daemon' EXIT

# `-f` is required: the file is a Containerfile, which podman finds by name and docker
# does not -- docker looks for `Dockerfile` and fails with "no such file or directory".
"$runtime" build -f {{config_root}}/packaging/sandbox/Containerfile \
  -t "${MICOLD_IMAGE_TAG:-micold-daemon:dev}" {{config_root}}/packaging/sandbox
echo "Built ${MICOLD_IMAGE_TAG:-micold-daemon:dev} -- select it in Settings > Daemon > Image."
"""

[tasks.sweep]
description = "Reclaim space in every target dir -- shared and per-worktree (default: artifacts unused for 7 days) [build-locked]"
run = """
command -v cargo-sweep >/dev/null 2>&1 || cargo install cargo-sweep --locked

# Sweeping deletes by age, and the oldest artifacts in a shared target dir are
# usually dependencies that a running build is still linking against -- so a
# sweep under a live compiler costs that build a rebuild. The lock below only
# covers mise tasks; a bare `cargo` in a worktree is not covered, hence this
# check. SWEEP_FORCE=1 skips it.
if [ -z "${SWEEP_FORCE:-}" ] && pgrep -x cargo >/dev/null 2>&1; then
  echo "sweep: a cargo build is running -- wait for it, or set SWEEP_FORCE=1" >&2
  exit 1
fi

# sweep-targets.sh walks `git worktree list` and sweeps each checkout's own
# target dir, because there are two of them: `mise run` builds land in the
# shared dir beside the main checkout (build-lock.sh exports CARGO_TARGET_DIR),
# while a bare `cargo` in a worktree resolves target-dir from that worktree's
# own .cargo/config.toml and builds beside the worktree instead. Sweeping only
# the shared one leaves the per-worktree dirs growing unbounded.
#
# It is run *through* build-lock.sh for the lock, and unsets the exported
# CARGO_TARGET_DIR itself so that lock does not pin every pass to one directory.
#
# SWEEP_ARGS overrides the default, e.g.
#   SWEEP_ARGS='--dry-run --time 7' mise run sweep     # show what would go
#   SWEEP_ARGS='--maxsize 50GB'     mise run sweep     # bound each directory
#   SWEEP_ARGS='--installed'        mise run sweep     # drop old toolchains
args="${SWEEP_ARGS:-"--time 7"}"
{{config_root}}/scripts/build-lock.sh {{config_root}}/scripts/sweep-targets.sh $args
"""

[tasks.deb]
description = "Build the Debian .deb package for the host arch (installs cargo-deb if missing) [build-locked]"
run = """
command -v cargo-deb >/dev/null 2>&1 || cargo install cargo-deb --locked
{{config_root}}/scripts/build-lock.sh cargo deb -p micold-client
echo 'Built:'
ls -1 "$({{config_root}}/scripts/build-lock.sh --print-target-dir)"/debian/*.deb
"""
