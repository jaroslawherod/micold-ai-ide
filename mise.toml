[tools]
rust = "stable"
uv = "latest"

[tasks.run]
description = "Run the GUI client (feature 010: spawns/attaches the session daemon)"
run = "cargo run -p micold-client"

[tasks.showcase]
description = "Run the component showcase (feature 020): every shared component on one page"
run = "cargo run -p micold-client --bin micold-showcase"

[tasks.daemon]
description = "Run the session daemon directly (normally auto-spawned by the client)"
run = "cargo run -p micold-daemon"

[tasks.fixture]
description = "Build the 20-worktree reference scene for the frame-time measurement (018 §B8)"
run = "scripts/reference-scene.sh"

[tasks.test]
description = "Test the whole workspace (core + client + daemon), matching CI"
run = "cargo test --workspace"

[tasks.test-core]
description = "Test the render-free core only (fast, no GUI / no iced)"
run = "cargo test -p micold-core --all-targets"

[tasks.build]
description = "Build the release GUI binary"
run = "cargo build --release -p micold-client"

[tasks.deb]
description = "Build the Debian .deb package for the host arch (installs cargo-deb if missing)"
run = """
command -v cargo-deb >/dev/null 2>&1 || cargo install cargo-deb --locked
cargo deb -p micold-client
echo 'Built:'
ls -1 target/debian/*.deb
"""
