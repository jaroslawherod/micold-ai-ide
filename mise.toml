[tools]
# The components are the gate's formatter and linter and the rust-analyzer the `LSP` tool starts, so
# `mise install` alone gives a container session everything the gate and the instructions use
# (#1439, FR-008). They are here, not in rust-toolchain.toml, so a bare `cargo` in CI does not
# download rust-analyzer too.
rust = { version = "stable", components = "rustfmt,clippy,rust-analyzer" }
uv = "latest"
# The documentation site's accessibility check runs axe-core in a real browser (feature 028): the
# rules it implements -- rendered contrast, focus visibility, reachable names -- are properties of a
# rendered page, not of markup, so there is nothing in the Rust toolchain that could take its place.
node = "24"
# The web client (#1735) is a pnpm workspace (package.json, pnpm-workspace.yaml) beside the Rust
# one; node above is shared with the docs axe check, so only the package manager is added.
pnpm = "10"

# The clips are encoded from captured frames (feature 028). ffmpeg is the one publication
# prerequisite with no Rust or npm equivalent, and installing it needs root on most distributions —
# which a documentation build should not. mise's conda backend puts a build with libx264 and
# libvpx-vp9 (and ffprobe, which the encode test reads durations with) on the task's PATH without
# one. CI installs the distribution's package instead: `pages.yml` runs as root on a throwaway
# runner, where apt is the shorter path.
ffmpeg = "8"

# `mise run test` and `mise run gate` run the workspace suite with nextest (issue #1649, evaluated
# in #1635): it ran micold-core's 4656 tests in 40.6s, in parallel, using the same test binaries
# `cargo test` builds. A pinned binary from the project's own GitHub releases, through mise's
# `github` backend (it auto-matches the release asset for each CI runner's OS/arch), so a fresh
# worktree and CI get it without the ~4 minute `cargo install cargo-nextest --locked` source build.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.150"

# Every cargo task below goes through scripts/build-lock.sh, which points cargo
# at one shared target directory beside the main checkout instead of a ~30 GB
# target/ per worktree.
#
# The batch tasks additionally take a lock in the shared git dir, so only one of
# them compiles at a time *across every worktree*. `jobs = 4` in
# .cargo/config.toml only caps a single cargo process; four worktrees building
# at once still means sixteen jobs, which oversubscribes RAM and stalls the
# machine on swap I/O. Set MICOLD_NO_BUILD_LOCK=1 to bypass the lock for a
# one-off run.
#
# The interactive tasks below pass --no-lock: they share the target directory,
# but stay in the foreground for as long as you use the app, and holding the
# build lock for that whole time would block every other worktree.

[tasks.daemon]
description = "Run the session daemon directly"
run = "{{config_root}}/scripts/build-lock.sh --no-lock cargo run -p micold-daemon"

[tasks.client-test]
description = "Web client: install, lint, typecheck and Jest with coverage (#1735, FR-002)"
dir = "{{config_root}}"
run = """
pnpm install --frozen-lockfile
pnpm --filter @micold/client lint
pnpm --filter @micold/client typecheck
pnpm --filter @micold/protocol typecheck
pnpm --filter @micold/client test --coverage
"""

[tasks.client-web]
description = "Web client: static web export of the production build, into apps/client/dist (#1735, FR-002)"
dir = "{{config_root}}"
run = """
pnpm install --frozen-lockfile
pnpm --filter @micold/client web:export
"""

[tasks.client-start]
description = "Web client: Expo dev server for the web against a real orchestrator, at EXPO_PUBLIC_ORCHESTRATOR_URL (default ws://127.0.0.1:8730/api/ws; #1732)"
alias = "web"
dir = "{{config_root}}"
run = """
pnpm install --frozen-lockfile
pnpm --filter @micold/client start
"""

[tasks.client-web-mock]
description = "Web client: Expo dev server for the web against the in-memory mock API only, no orchestrator (#2025, #1732)"
dir = "{{config_root}}"
run = """
pnpm install --frozen-lockfile
pnpm --filter @micold/client start:mock
"""

[tasks.local-stack]
description = "Run the orchestrator (Postgres state), one seeded daemon and the web client in a kind cluster micold-local, forwarded to 127.0.0.1:8730/8731; Ctrl+C deletes it unless MICOLD_LOCAL_KEEP=1. MICOLD_LOCAL_MODE=process runs them as local processes instead (#1732) [needs docker; mise fetches kind, kubectl, helm]"
dir = "{{config_root}}"
run = "scripts/local-stack.sh"
# kind mode's tools, task-scoped so `mise run local-stack` on a fresh checkout fetches them and no
# other task or CI job downloads them. Same pins as scripts/install-kube-tools.sh (CI's installer);
# scripts/tests/local-stack-tools.test.sh fails when the two drift. docker stays a prerequisite: the
# CLI is useless without a daemon, which mise cannot provide.
tools = { kind = "0.33.0", kubectl = "1.37.2", helm = "4.3.2" }

[tasks.client-e2e]
description = "Web client: Playwright smoke, pseudo-locale and screenshot specs in Chromium, Firefox and WebKit against the mock export (#1735, T055)"
dir = "{{config_root}}"
run = """
pnpm install --frozen-lockfile
pnpm --filter @micold/client web:export:mock
pnpm --filter @micold/client exec playwright install chromium firefox webkit
pnpm --filter @micold/client e2e
"""

[tasks.client-e2e-stack]
description = "Web client: Playwright in Chromium, Firefox and WebKit against the real stack (scripts/local-stack.sh, process mode: orchestrator, seeded daemon, web export) on 127.0.0.1:8730/8731 (#1732, T039)"
dir = "{{config_root}}"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
EXPO_PUBLIC_ORCHESTRATOR_URL=ws://127.0.0.1:8730/api/ws pnpm --filter @micold/client web:export
scripts/build-lock.sh cargo build -p micold-daemon
export MICOLD_LOCAL_DAEMON_BIN="$(scripts/build-lock.sh --print-target-dir)/debug/micold-daemon"
export MICOLD_LOCAL_WEB_DIR="$PWD/apps/client/dist"
pnpm --filter @micold/client exec playwright install chromium firefox webkit
pnpm --filter @micold/client e2e:stack
"""

[tasks.autopilot-tokens]
description = "Report token usage per autopilot unit from this worktree's Claude Code sessions"
run = "scripts/autopilot-tokens.py --worktree"

[tasks.autopilot-skill-size]
description = "Estimate the tokens each autopilot role loads; pass a git ref to see the delta against it"
run = "scripts/autopilot/measure-skill.sh"

[tasks.check]
description = "Check the whole workspace without linking (fast edit loop) [build-locked]"
run = "{{config_root}}/scripts/build-lock.sh cargo check --workspace"

[tasks.test]
description = "Test the whole workspace (core + daemon) with nextest, matching CI [build-locked]"
# nextest does not run doctests (issue #1649); `cargo test --doc` runs them on its own so none are
# silently skipped. See the `github:nextest-rs/nextest` tool comment above and scripts/gate.sh.
run = """
{{config_root}}/scripts/build-lock.sh bash -c '
  nextest_rc=0; cargo nextest run --workspace --no-fail-fast || nextest_rc=$?
  doc_rc=0; cargo test --doc --workspace || doc_rc=$?
  exit $((nextest_rc == 0 ? doc_rc : nextest_rc))'
"""

[tasks.test-core]
description = "Test the render-free core only (fast) [build-locked]"
run = "{{config_root}}/scripts/build-lock.sh cargo test -p micold-core --all-targets"

[tasks.bench-routing]
description = "Run the SC-003 routing latency benchmark (ignored in the gate) [build-locked]"
run = "{{config_root}}/scripts/build-lock.sh cargo test -p micold-daemon --release --test orchestrator_route -- --ignored bench"

[tasks.test-scripts]
description = "Run every scripts/tests/*.test.sh (the docs-only local gate)"
dir = "{{config_root}}"
run = """
set -e
for t in scripts/tests/*.test.sh; do
  echo "== $t"
  "$t"
done
"""

[tasks.api-types]
description = "Regenerate the client API's JSON Schema, TypeScript types and FR-012 vectors from the Rust types (#1732); `-- --check` fails when stale [build-locked]"
dir = "{{config_root}}"
run = "scripts/api-types.sh"

# CI's `lint` job and the Linux leg of `test`, in CI's order. The gate run by habit was clippy +
# test, which a branch can pass for ever while CI stops at `cargo fmt --check` -- the first step of
# `lint`, which `ci complete` gates every other job on. The shell suites need no build, so they run
# after the lock is released.
[tasks.gate]
description = "Run CI's merge gate locally: fmt, clippy (core + workspace), workspace tests, shell suites [build-locked]"
dir = "{{config_root}}"
# The steps live in the script so the gate also runs without mise (cloud containers). As root it runs
# the test binaries as a normal user; see scripts/run-unprivileged.sh.
run = "scripts/gate.sh"

# Diff guardrails (#1931). Opt-in, not part of `gate`: both need a tool outside the pinned toolchain
# (`cargo install cargo-llvm-cov cargo-mutants --locked`, plus the llvm-tools-preview rustup component)
# and take minutes. CI runs the same scripts on pull requests. Scope and threshold:
# scripts/guardrails-scope.conf; docs/development/diff-guardrails.md.
[tasks.coverage-diff]
description = "Check that the lines this branch changed (daemon, orchestrator) are covered, vs origin/main [build-locked]"
dir = "{{config_root}}"
run = """
set -e
scripts/build-lock.sh cargo llvm-cov nextest -p micold-core -p micold-daemon --no-fail-fast --lcov --output-path lcov.info
scripts/diff-coverage.py --lcov lcov.info --base "${BASE:-origin/main}"
"""

[tasks.mutants-diff]
description = "Mutation-test the lines this branch changed (daemon, orchestrator), vs origin/main; minutes [build-locked]"
dir = "{{config_root}}"
run = "scripts/build-lock.sh scripts/mutants-diff.sh \"${BASE:-origin/main}\""

# Duplication budget (issue #645). Not part of `gate`: jscpd is an npx download and similarity-rs a
# `cargo install`, both outside the pinned toolchain, and the gate must stay offline and reproducible.
# Measured 2026-10-16: jscpd 1.81% duplicated lines (272 clones, after #645), similarity-rs 701 pairs. The budgets
# sit just above that, so the task fails when a change adds duplication, never on today's tree. When a
# refactor lowers a number, lower the budget with it. Tools: docs/development/duplication.md.
[tasks.duplication]
description = "Fail when code duplication exceeds the budget (jscpd % lines, similarity-rs pairs); ~30 s, no build"
dir = "{{config_root}}"
run = """
set -e
max_pct=1.82
max_pairs=745
command -v similarity-rs >/dev/null 2>&1 || { echo "duplication: run 'cargo install similarity-rs' first" >&2; exit 1; }
npx -y jscpd@4 crates --format rust --min-lines 8 --min-tokens 80 --gitignore --threshold "$max_pct"
pairs=$(similarity-rs crates/*/src --skip-test -t 0.85 -m 8 | sed -n 's/^Total duplicate pairs found: //p')
echo "similarity-rs: ${pairs:?no summary line} similar pairs (budget $max_pairs)"
[ "$pairs" -le "$max_pairs" ] || { echo "duplication: over the similarity-rs budget" >&2; exit 1; }
"""

[tasks.test-sandbox]
description = "Run the real-runtime sandbox tests against an installed container runtime (feature 027) [build-locked]"
run = """
# Both halves of the real-runtime suite, in the one shape that reports the truth. Getting this
# invocation wrong is not loud -- it is silent, and every way of getting it wrong reports success:
#
#   * omitting `micold-daemon` skips the eleven tests carrying the headline claims,
#   * omitting `--release` makes `sandbox_real_session_start` refuse to measure, and without
#     `--no-fail-fast` cargo then stops there and skips every target after it,
#   * omitting `--test-threads=1` lets two tests contend for one container name and one port,
#   * `sandbox_real_` is matched against **test names**, not file names.
#
# It needs `micold-basic:dev` present: build it with `mise run image` first.
set -e

runtime="${MICOLD_RUNTIME:-docker}"
command -v "$runtime" >/dev/null 2>&1 || { echo "test-sandbox: $runtime is not installed" >&2; exit 1; }
"$runtime" image inspect "${MICOLD_BASIC_IMAGE_TAG:-micold-basic:dev}" >/dev/null 2>&1 || {
  echo "test-sandbox: ${MICOLD_BASIC_IMAGE_TAG:-micold-basic:dev} is not built -- run 'mise run image'" >&2
  exit 1
}

{{config_root}}/scripts/build-lock.sh cargo test --release \
  -p micold-core -p micold-daemon \
  --features micold-core/sandbox-real-runtime,micold-daemon/sandbox-real-runtime \
  sandbox_real_ --no-fail-fast -- --test-threads=1
"""

[tasks.test-ssh]
description = "Run the real-sshd remote-daemon tests (feature 489): needs the `sshd` and `ssh` binaries, no root [build-locked]"
run = """
# `ssh_real_` is matched against **test names**; one test at a time, because each starts its own
# rootless sshd and a stand-in remote daemon. The harness skips with a printed reason when `sshd`
# is not installed (it never fails a machine that cannot run it).
{{config_root}}/scripts/build-lock.sh cargo build -p micold-daemon --features ssh-real-runtime
{{config_root}}/scripts/build-lock.sh cargo test -p micold-daemon \
  --features ssh-real-runtime \
  ssh_real_ --no-fail-fast -- --test-threads=1
"""

[tasks.chart-check]
description = "Lint and validate the Helm chart deploy/helm/micold (helm lint, kubeconform, conformance test; #1981): needs helm and kubeconform, which scripts/install-kube-tools.sh pins"
dir = "{{config_root}}"
run = "scripts/chart-check.sh"

[tasks.e2e-kind]
description = "Run the orchestrator end-to-end suites on a throwaway kind cluster (#1981): needs docker, kind, kubectl, helm; MICOLD_E2E_KEEP=1 keeps it, MICOLD_E2E_SUITES picks suites (docs/development/kube-e2e.md)"
dir = "{{config_root}}"
run = "scripts/e2e-kind.sh"

[tasks.image]
description = "Build the :dev basic image (sshd and session tools, no daemon) from packaging/basic (feature 806) [build-locked]"
run = """
# The container daemon's image is the basic image (feature 806): the daemon is copied in over SSH, so there is no daemon to build or stage here and no glibc check to run.
# `sandbox_real_*` in `mise run test-sandbox` start from this tag.
set -e

runtime="${MICOLD_RUNTIME:-docker}"
command -v "$runtime" >/dev/null 2>&1 || { echo "image: $runtime is not installed" >&2; exit 1; }

# `-f` is required: the file is a Containerfile, which podman finds by name and docker
# does not -- docker looks for `Dockerfile` and fails with "no such file or directory".
tag="${MICOLD_BASIC_IMAGE_TAG:-micold-basic:dev}"
"$runtime" build -f {{config_root}}/packaging/basic/Containerfile -t "$tag" {{config_root}}/packaging/basic
echo "Built $tag."
"""

[tasks.sweep]
description = "Reclaim space in every target dir -- shared and per-worktree (default: artifacts unused for 7 days) [build-locked]"
run = """
command -v cargo-sweep >/dev/null 2>&1 || cargo install cargo-sweep --locked

# Sweeping deletes by age, and the oldest artifacts in a shared target dir are
# usually dependencies that a running build is still linking against -- so a
# sweep under a live compiler costs that build a rebuild. The lock below only
# covers mise tasks; a bare `cargo` in a worktree is not covered, hence this
# check. SWEEP_FORCE=1 skips it.
if [ -z "${SWEEP_FORCE:-}" ] && pgrep -x cargo >/dev/null 2>&1; then
  echo "sweep: a cargo build is running -- wait for it, or set SWEEP_FORCE=1" >&2
  exit 1
fi

# sweep-targets.sh walks `git worktree list` and sweeps each checkout's own
# target dir, because there are two of them: `mise run` builds land in the
# shared dir beside the main checkout (build-lock.sh exports CARGO_TARGET_DIR),
# while a bare `cargo` in a worktree resolves target-dir from that worktree's
# own .cargo/config.toml and builds beside the worktree instead. Sweeping only
# the shared one leaves the per-worktree dirs growing unbounded.
#
# It is run *through* build-lock.sh for the lock, and unsets the exported
# CARGO_TARGET_DIR itself so that lock does not pin every pass to one directory.
#
# SWEEP_ARGS overrides the default, e.g.
#   SWEEP_ARGS='--dry-run --time 7' mise run sweep     # show what would go
#   SWEEP_ARGS='--maxsize 50GB'     mise run sweep     # bound each directory
#   SWEEP_ARGS='--installed'        mise run sweep     # drop old toolchains
args="${SWEEP_ARGS:-"--time 7"}"
# Recurring (cron/systemd timer): SWEEP_ARGS='--maxsize 60GB' mise run sweep
{{config_root}}/scripts/build-lock.sh {{config_root}}/scripts/sweep-targets.sh $args
"""

# The static Linux daemons for remote hosts (feature 806 FR-009), built into the workspace's own
# `target/remote-daemon`, not the shared target dir. zig comes from
# mise, so a clean checkout needs no system zig.
[tasks.remote-daemons]
description = "Cross-build the static Linux daemons for remote hosts and containers into target/remote-daemon [build-locked]"
dir = "{{config_root}}"
tools = { zig = "0.14" }
run = """
command -v cargo-zigbuild >/dev/null 2>&1 || cargo install cargo-zigbuild --locked
rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
scripts/remote-daemon-bundle.sh --out target/remote-daemon
"""

[tasks.site-build]
description = "Build the documentation site (feature 028): emit theme, capture, stage, render, check"
run = "{{config_root}}/site/build.sh"

[tasks.site-check]
description = "Run the site's checks against an existing build (feature 028)"
run = "{{config_root}}/site/build.sh --checks-only"
