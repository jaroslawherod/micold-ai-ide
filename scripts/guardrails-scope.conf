# Scope of the diff guardrails (#1931): which changed files diff coverage (scripts/diff-coverage.py)
# and mutation testing (scripts/mutants-diff.sh) look at. One path-glob list per language, one glob
# per line; `**` crosses directories, `*` does not. Both CI jobs and the `mise run coverage-diff` /
# `mise run mutants-diff` tasks read this file and nothing else.
#
# micold-client and micold-material (the iced desktop app) are being sunset and are left out on
# purpose. To bring the future web client in, list its sources under [web] and run
# `scripts/diff-coverage.py --lang web --lcov <its lcov file>`; nothing else changes.

[settings]
# Minimum share of changed executable lines in scope that the tests run.
threshold = 80

[rust]
crates/micold-daemon/src/**
crates/micold-core/src/orchestrator/**

[web]
